                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [ACC_CANAL_NO_HABILITADO, ACC_ROL_NO_ADMITIDO, ACC_TRANSICION_NO_PERMITIDA, ACC_ELIMINACION_NO_PERMITIDA, ACC_MOTIVO_SOPORTE_INVALIDO]
