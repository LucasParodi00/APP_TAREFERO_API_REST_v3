        "500":
          description: "El cambio y la revocación no se pudieron confirmar."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [ACC_CAMBIO_CREDENCIAL_NO_COMPLETADO]
  /empresas/{id}/cuentas-empresa/{cuentaId}/restablecimientos-contrasenia:
    parameters:
      - $ref: "#/components/parameters/IdentificadorEmpresa"
