                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [ACC_ACCESO_DENEGADO, ACC_CUENTA_EMPRESA_INCOMPATIBLE, ACC_CANAL_NO_HABILITADO, ACC_ACCESO_NO_HABILITADO]
        "500":
          $ref: "#/components/responses/ErrorInterno"
  /empresas/{id}/cuentas-empresa/{cuentaId}/cambios-contrasenia:
