                  - properties:
                      code:
                        enum: [ACC_MOTIVO_SOPORTE_INVALIDO]
        "500":
          $ref: "#/components/responses/ErrorInterno"
    patch:
      tags: [Cuentas]
      summary: "Modificar roles o canales de una Cuenta"
      description: "Actualiza los roles o los canales que se indiquen. Una solicitud de eliminación física se rechaza de acuerdo con ACC-BR-017."
      operationId: modificarHabilitacionCuenta
      x-use-case: ACC-UC-010
      x-business-rules: [ACC-BR-002, ACC-BR-005, ACC-BR-006, ACC-BR-007, ACC-BR-016, ACC-BR-017]
      x-use-cases-internos: [ACC-UC-003, ACC-UC-007]
      parameters:
        - $ref: "#/components/parameters/VersionConocidaCuenta"
        - name: Idempotency-Key
          in: header
          description: "Clave de reintento vinculada al actor, la Empresa y la operación."
          required: false
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/MotivoSoporte"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SolicitudModificarHabilitacion"
      responses:
        "200":
          description: "Cuenta de Empresa visible para el actor autorizado."
          headers:
            ETag:
              required: true
              schema:
                $ref: "#/components/schemas/EtiquetaCuenta"
            Cache-Control:
              description: "La respuesta contiene información privada."
              required: true
              schema:
                type: string
                const: no-store
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/RespuestaCuentaEmpresa"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          description: "Permiso, alcance o contexto de soporte insuficiente."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [ACC_ACCESO_DENEGADO, ACC_EMPRESA_FUERA_DE_ALCANCE, ACC_CONTEXTO_SOPORTE_REQUERIDO]
        "404":
          description: "Cuenta ausente dentro del alcance autorizado."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [ACC_CUENTA_NO_ENCONTRADA]
        "409":
          description: "Versión desactualizada, cupo agotado o reintento en conflicto."
          content:
