  /sesiones-empresa:
    post:
      tags: [Sesiones]
      summary: "Iniciar Sesión de Empresa"
      description: "Verifica alias, correo, contraseña y canal; crea una Sesión para la Cuenta de Empresa."
      operationId: iniciarSesionEmpresa
      x-use-case: ACC-UC-002
      x-business-rules: [ACC-BR-001, ACC-BR-005, ACC-BR-012, ACC-BR-018, ACC-BR-019]
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SolicitudInicioSesionEmpresa"
      responses:
        "200":
          description: "Sesión emitida. Las credenciales de respuesta son confidenciales."
          headers:
            Cache-Control:
              description: "La respuesta contiene información privada."
              required: true
              schema:
                type: string
                const: no-store
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/RespuestaSesionEmpresa"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
