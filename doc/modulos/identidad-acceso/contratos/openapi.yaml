      x-use-case: ACC-UC-005
      x-business-rules: [ACC-BR-001, ACC-BR-002, ACC-BR-010, ACC-BR-011, ACC-BR-012, ACC-BR-014, ACC-BR-019, ACC-BR-020]
      x-use-cases-internos: [ACC-UC-003, ACC-UC-007]
      parameters:
        - $ref: "#/components/parameters/MotivoSoporte"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SolicitudRestablecimientoContrasenia"
      responses:
        "204":
          description: "Credencial actualizada y Sesiones de la cuenta afectada revocadas."
          headers:
            Cache-Control:
              description: "La respuesta contiene información privada."
              required: true
              schema:
                type: string
                const: no-store
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          description: "Actor, Empresa, Cuenta o contexto de soporte fuera del alcance autorizado."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [ACC_ACCESO_DENEGADO, ACC_CUENTA_EMPRESA_INCOMPATIBLE, ACC_EMPRESA_FUERA_DE_ALCANCE, ACC_RESTABLECIMIENTO_FUERA_DE_ALCANCE, ACC_CONTEXTO_SOPORTE_REQUERIDO]
        "404":
          description: "Cuenta ausente dentro del alcance autorizado."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [ACC_CUENTA_NO_ENCONTRADA]
        "422":
          description: "Contraseña o motivo de soporte inválidos."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [ACC_CONTRASENIA_INVALIDA, ACC_MOTIVO_SOPORTE_INVALIDO]
        "500":
          description: "El restablecimiento y la revocación no se pudieron confirmar."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [ACC_CAMBIO_CREDENCIAL_NO_COMPLETADO]
x-controles-transversales:
  acceso-vigente:
    x-use-case: ACC-UC-003
    x-business-rules: [ACC-BR-002, ACC-BR-007]
    description: "Control interno de las operaciones autenticadas con una Sesión de Empresa, sin operación HTTP propia."
    responses:
      "401":
        description: "Sesión ausente, vencida o revocada."
        headers:
          WWW-Authenticate:
            required: true
            schema:
              type: string
        content:
          "application/problem+json":
            schema:
              allOf:
                - $ref: "#/components/schemas/Problema"
                - properties:
                    code:
                      enum: [ACC_SESION_NO_VIGENTE]
      "403":
        description: "Permiso, alcance o rol incompatibles con la operación."
        content:
          "application/problem+json":
            schema:
              allOf:
                - $ref: "#/components/schemas/Problema"
                - properties:
                    code:
                      enum: [ACC_ACCESO_DENEGADO, ACC_EMPRESA_FUERA_DE_ALCANCE, ACC_ROL_NO_ADMITIDO]
components:
  securitySchemes:
    Autenticacion:
      type: http
      scheme: bearer
      description: Credencial entregada por el mecanismo operativo correspondiente.
  parameters:
    IdentificadorCuenta:
      name: cuentaId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identificador"
    VersionConocidaCuenta:
      name: If-Match
      in: header
      description: "ETag de la última representación conocida de la Cuenta de Empresa."
      required: true
      schema:
        $ref: "#/components/schemas/EtiquetaCuenta"
    IdentificadorEmpresa:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identificador'
    MotivoSoporte:
      name: Motivo-Soporte
      in: header
      required: false
      description: Requerida para las operaciones en contexto de soporte de SuperAdministrador. Enviar el motivo en UTF-8 con codificación porcentual.
      schema:
        type: string
      example: Revision%20solicitada%20por%20la%20Empresa
  responses:
    FormatoInvalido:
      description: Solicitud con formato inválido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    AutenticacionInvalida:
      description: Autenticación ausente o inválida.
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    ErrorInterno:
      description: Error interno con información segura.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
  schemas:
    EtiquetaCuenta:
      type: string
      pattern: "^\"acc-[1-9][0-9]*\"$"
    SolicitudHabilitarCuenta:
      type: object
      additionalProperties: false
      required: [personaId, correoAcceso, contrasenia, accesoWeb, accesoMovil, roles]
      properties:
        personaId:
          $ref: "#/components/schemas/Identificador"
        correoAcceso:
          type: string
          description: "Se valida y se limita a 254 caracteres después de la normalización de ACC-BR-018."
        contrasenia:
          type: string
          format: password
          minLength: 15
          maxLength: 128
          writeOnly: true
        accesoWeb:
          type: boolean
        accesoMovil:
          type: boolean
        roles:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            type: string
            enum: [ADMINISTRADOR, CAPATAZ, EMPLEADO]
    SolicitudModificarHabilitacion:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        accesoWeb:
          type: boolean
        accesoMovil:
          type: boolean
        roles:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            type: string
            enum: [ADMINISTRADOR, CAPATAZ, EMPLEADO]
    RespuestaCuentaEmpresa:
      type: object
      additionalProperties: false
      required: [id, empresaId, personaId, correoAcceso, accesoWeb, accesoMovil, roles, estado, version]
      properties:
        id:
          $ref: "#/components/schemas/Identificador"
        empresaId:
          $ref: "#/components/schemas/Identificador"
        personaId:
          $ref: "#/components/schemas/Identificador"
        correoAcceso:
          type: string
          maxLength: 254
        accesoWeb:
          type: boolean
        accesoMovil:
          type: boolean
        roles:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            type: string
            enum: [ADMINISTRADOR, CAPATAZ, EMPLEADO]
        estado:
          type: string
          enum: [ACTIVA, SUSPENDIDA]
        version:
          type: integer
          minimum: 1
    RespuestaListadoCuentas:
      type: object
      additionalProperties: false
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: "#/components/schemas/RespuestaCuentaEmpresa"
        paginacion:
          type: object
          additionalProperties: false
          required: [limite, desplazamiento, total]
          properties:
            limite:
              type: integer
              minimum: 1
              maximum: 100
            desplazamiento:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
    SolicitudInicioSesionEmpresa:
      type: object
      additionalProperties: false
      required: [aliasEmpresa, correoAcceso, contrasenia, canal]
      properties:
        aliasEmpresa:
          type: string
          minLength: 1
        correoAcceso:
          type: string
          description: "Se valida y se limita a 254 caracteres después de la normalización de ACC-BR-018."
        contrasenia:
          type: string
          format: password
          minLength: 15
          maxLength: 128
          writeOnly: true
        canal:
          type: string
          enum: [WEB, MOVIL]
    SolicitudRenovacionSesionEmpresa:
      type: object
      additionalProperties: false
      required: [tokenRenovacion, canal]
      properties:
        tokenRenovacion:
          type: string
          minLength: 1
          writeOnly: true
        canal:
          type: string
          enum: [WEB, MOVIL]
    SolicitudCambioContrasenia:
      type: object
      additionalProperties: false
      required: [contraseniaActual, contraseniaNueva]
      properties:
        contraseniaActual:
          type: string
          format: password
          minLength: 15
          maxLength: 128
          writeOnly: true
        contraseniaNueva:
          type: string
          format: password
          minLength: 15
          maxLength: 128
          writeOnly: true
    SolicitudRestablecimientoContrasenia:
      type: object
      additionalProperties: false
      required: [contraseniaNueva]
      properties:
        contraseniaNueva:
          type: string
          format: password
          minLength: 15
          maxLength: 128
          writeOnly: true
    RespuestaSesionEmpresa:
      type: object
      additionalProperties: false
      required: [empresaId, cuentaId, sesionId, tokenAcceso, tokenRenovacion, expiraAccesoEn, expiraRenovacionEn]
      properties:
        empresaId:
          $ref: "#/components/schemas/Identificador"
        cuentaId:
          $ref: "#/components/schemas/Identificador"
        sesionId:
          $ref: "#/components/schemas/Identificador"
        tokenAcceso:
          type: string
          minLength: 1
        tokenRenovacion:
          type: string
          minLength: 1
        expiraAccesoEn:
          type: string
          format: date-time
        expiraRenovacionEn:
          type: string
          format: date-time
    Identificador:
      type: string
      format: uuid
    SolicitudCrearSuperAdministrador:
      type: object
      additionalProperties: false
      properties:
        rol:
          type: string
          default: SUPER_ADMINISTRADOR
    RespuestaSuperAdministrador:
      type: object
      additionalProperties: false
      required: [id, rol, activo]
      properties:
        id:
          $ref: '#/components/schemas/Identificador'
        rol:
          type: string
          const: SUPER_ADMINISTRADOR
        activo:
          type: boolean
          const: true
    RespuestaListadoIntervenciones:
      type: object
      additionalProperties: false
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/ResumenIntervencion'
        paginacion:
          type: object
          additionalProperties: false
          required: [limite, desplazamiento, total]
          properties:
            limite:
              type: integer
              minimum: 1
              maximum: 100
            desplazamiento:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
    ResumenIntervencion:
      type: object
      additionalProperties: false
      required: [id, ocurridaEn, actor]
      properties:
        id:
          $ref: '#/components/schemas/Identificador'
        ocurridaEn:
          type: string
          format: date-time
        actor:
          type: string
          const: Soporte de plataforma
    Problema:
      type: object
      required: [type, title, status, code, detail, instance, solicitudId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        solicitudId:
          $ref: '#/components/schemas/Identificador'
        errores:
          type: array
          items:
            type: object
            required: [campo, code, mensaje]
            properties:
              campo:
                type: string
              code:
                type: string
              mensaje:
                type: string
