openapi: 3.1.0
info:
  title: Tarefero API REST — Identidad y acceso
  version: 0.1.0
  description: Contratos de PLAN-ACC-0001, PLAN-ACC-0002 y PLAN-ACC-0003. Las operaciones de los dos últimos planes están propuestas.
  contact:
    name: Tarefero
servers:
  - url: /api/v1
tags:
  - name: Plataforma
    description: Administración autorizada de identidades de plataforma.
  - name: Soporte
    description: Historial autorizado de intervenciones de soporte.
  - name: Cuentas
    description: Administración autorizada de Cuentas de Empresa.
  - name: Sesiones
    description: Autenticación y administración de credenciales de Empresa.
security:
  - Autenticacion: []
paths:
  /superadministradores:
    post:
      tags: [Plataforma]
      summary: Crear un SuperAdministrador
      operationId: crearSuperAdministrador
      description: Registra una identidad de plataforma mediante el flujo autorizado.
      x-use-case: ACC-UC-006
      x-business-rules: [ACC-BR-007]
      parameters:
        - name: Idempotency-Key
          in: header
          description: Clave de reintento del alta.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCrearSuperAdministrador'
      responses:
        '201':
          description: Identidad de plataforma registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaSuperAdministrador'
        '400':
          $ref: '#/components/responses/FormatoInvalido'
        '401':
          $ref: '#/components/responses/AutenticacionInvalida'
        '403':
          description: Acceso denegado.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [ACC_ACCESO_DENEGADO]
        '409':
          description: Conflicto de idempotencia.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [ACC_IDEMPOTENCIA_CONFLICTO]
        '422':
          description: Solicitud de alta incompatible con el rol.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [ACC_ROL_NO_ADMITIDO]
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /empresas/{id}/intervenciones-soporte:
    parameters:
      - $ref: '#/components/parameters/IdentificadorEmpresa'
    get:
      tags: [Soporte]
      summary: Listar intervenciones de soporte
      operationId: listarIntervencionesSoporte
      description: Devuelve el historial visible de intervenciones de soporte de una Empresa.
      x-use-case: ACC-UC-011
      x-business-rules: [ACC-BR-002, ACC-BR-009, ACC-BR-011, ACC-BR-020]
      x-use-cases-internos: [ACC-UC-007]
      parameters:
        - $ref: '#/components/parameters/MotivoSoporte'
        - name: limite
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: desplazamiento
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: orden
          in: query
          description: El identificador ascendente desempata el orden.
          schema:
            type: string
            enum: ['ocurridaEn:asc', 'ocurridaEn:desc']
            default: 'ocurridaEn:desc'
      responses:
        '200':
          description: Página de intervenciones autorizadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaListadoIntervenciones'
        '400':
          $ref: '#/components/responses/FormatoInvalido'
        '401':
          $ref: '#/components/responses/AutenticacionInvalida'
        '403':
          description: Consulta o contexto de soporte sin autorización.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [ACC_ACCESO_DENEGADO, ACC_EMPRESA_FUERA_DE_ALCANCE, ACC_IDENTIDAD_PLATAFORMA_NO_VISIBLE, ACC_CONTEXTO_SOPORTE_REQUERIDO]
        '404':
          description: Empresa destino no encontrada al resolver el contexto de soporte.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [ACC_EMPRESA_NO_ENCONTRADA]
        '422':
          description: Motivo de soporte inválido.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [ACC_MOTIVO_SOPORTE_INVALIDO]
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /empresas/{id}/cuentas-empresa:
    parameters:
      - $ref: "#/components/parameters/IdentificadorEmpresa"
    post:
      tags: [Cuentas]
      summary: "Habilitar una Cuenta de Empresa"
      description: "Registra una Cuenta de Empresa vinculada a una Persona verificada. Aplica el flujo de Administrador inicial de ACC-Q-015 y el motivo cuando se opere mediante soporte."
      operationId: habilitarCuentaEmpresa
      x-use-case: ACC-UC-001
      x-business-rules: [ACC-BR-001, ACC-BR-002, ACC-BR-003, ACC-BR-004, ACC-BR-006, ACC-BR-007, ACC-BR-015, ACC-BR-016, ACC-BR-018, ACC-BR-019]
      x-use-cases-internos: [ACC-UC-003, ACC-UC-007]
      parameters:
        - name: Idempotency-Key
          in: header
          description: "Clave de reintento vinculada al actor, la Empresa y la operación."
          required: false
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/MotivoSoporte"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SolicitudHabilitarCuenta"
      responses:
        "201":
          description: "Cuenta habilitada."
          headers:
            ETag:
              required: true
              schema:
                $ref: "#/components/schemas/EtiquetaCuenta"
            Cache-Control:
              description: "La respuesta contiene información privada."
              required: true
              schema:
                type: string
                const: no-store
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/RespuestaCuentaEmpresa"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          description: "Permiso o alcance insuficiente."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [ACC_ACCESO_DENEGADO, ACC_EMPRESA_FUERA_DE_ALCANCE, ACC_CUENTA_EMPRESA_INCOMPATIBLE, ACC_CONTEXTO_SOPORTE_REQUERIDO]
        "409":
          description: "Unicidad, cupo o reintento en conflicto."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [ACC_CORREO_DUPLICADO, ACC_CUENTA_PERSONA_DUPLICADA, ACC_LIMITE_ACCESOS_ALCANZADO, ACC_IDEMPOTENCIA_CONFLICTO]
        "422":
          description: "Datos o condiciones de habilitación inválidos."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [ACC_CREDENCIALES_REQUERIDAS, ACC_CORREO_INVALIDO, ACC_CONTRASENIA_INVALIDA, ACC_ROL_NO_ADMITIDO, ACC_PERSONA_NO_DISPONIBLE, ACC_TRANSICION_NO_PERMITIDA, ACC_MOTIVO_SOPORTE_INVALIDO]
        "500":
          $ref: "#/components/responses/ErrorInterno"
        "503":
          description: "No se puede verificar la elegibilidad o el cupo."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [ACC_VALIDACION_COMERCIAL_NO_DISPONIBLE]
    get:
      tags: [Cuentas]
      summary: "Listar Cuentas de Empresa"
      description: "Lista únicamente Cuentas de Empresa autorizadas, ordenadas por identificador ascendente para paginar."
      operationId: listarCuentasEmpresa
      x-use-case: ACC-UC-008
      x-business-rules: [ACC-BR-002, ACC-BR-009]
      x-use-cases-internos: [ACC-UC-003, ACC-UC-007]
      parameters:
        - $ref: "#/components/parameters/MotivoSoporte"
        - name: limite
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: desplazamiento
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: "Página de cuentas autorizadas."
          headers:
            Cache-Control:
              description: "La respuesta contiene información privada."
              required: true
              schema:
                type: string
                const: no-store
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/RespuestaListadoCuentas"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          description: "Permiso, alcance o contexto de soporte insuficiente."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [ACC_ACCESO_DENEGADO, ACC_EMPRESA_FUERA_DE_ALCANCE, ACC_IDENTIDAD_PLATAFORMA_NO_VISIBLE, ACC_CONTEXTO_SOPORTE_REQUERIDO]
        "422":
          description: "Motivo de soporte inválido."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [ACC_MOTIVO_SOPORTE_INVALIDO]
        "500":
          $ref: "#/components/responses/ErrorInterno"
  /empresas/{id}/cuentas-empresa/{cuentaId}:
