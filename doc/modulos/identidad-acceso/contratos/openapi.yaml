              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [ACC_VERSION_CONFLICTO, ACC_LIMITE_ACCESOS_ALCANZADO, ACC_IDEMPOTENCIA_CONFLICTO]
        "422":
