openapi: 3.1.0
info:
  title: API del módulo Territorio — Chacras y Lotes
  description: >-
    Contrato HTTP integral del módulo Territorio (TER-TASK-002, TER-TASK-003, TER-TASK-005,
    TER-TASK-006 y TER-TASK-007) para registrar, modificar, inactivar, consultar y listar Chacras,
    y para administrar, consultar, delimitar y versionar Lotes.
    La Empresa y la autorización provienen exclusivamente del contexto validado por ACC.
  version: 1.0.0
  contact:
    name: Equipo Tarefero
servers:
  - url: /api/v1
    description: API v1
tags:
  - name: Chacras
    description: Administración de Chacras de una Empresa cliente
  - name: Lotes
    description: Administración territorial, delimitación espacial y versiones de Lotes
security:
  - bearerAuth: []
paths:
  /chacras:
    get:
      tags:
        - Chacras
      summary: Listar Chacras
      description: >-
        Lista las Chacras de la Empresa dentro del alcance autorizado. Por defecto incluye
        activas e inactivas. Admite paginación mediante limite y desplazamiento, y filtro por estado.
      operationId: listarChacras
      x-use-case: TER-UC-003
      x-business-rules:
        - TER-BR-004
      parameters:
        - name: limite
          in: query
          description: Cantidad máxima de registros por página
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: desplazamiento
          in: query
          description: Cantidad de registros a omitir
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: estado
          in: query
          description: Filtro opcional por estado
          required: false
          schema:
            $ref: '#/components/schemas/EstadoChacra'
        - name: orden
          in: query
          description: Criterio de ordenamiento (<campo>:<direccion>)
          required: false
          schema:
            type: string
            enum:
              - nombre:asc
              - nombre:desc
              - nombreCorto:asc
              - nombreCorto:desc
              - creadoEn:asc
              - creadoEn:desc
            default: creadoEn:desc
      responses:
        '200':
          description: Página de Chacras autorizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaChacras'
        '400':
          description: Paginación, filtros u orden no admitidos
          x-error-codes:
            - TER_CONSULTA_INVALIDA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaConsultaInvalida'
        '401':
          description: Sesión ausente, inválida o no vigente
          x-error-codes:
            - ACC_SESION_NO_VIGENTE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaNoAutenticado'
        '403':
          description: Actor sin permiso o soporte sin contexto explícito
          x-error-codes:
            - TER_ACCESO_DENEGADO
            - ACC_CONTEXTO_SOPORTE_REQUERIDO
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaAccesoDenegado'
    post:
      tags:
        - Chacras
      summary: Registrar una Chacra
      description: >-
        Registra una Chacra ACTIVA en la Empresa del contexto autorizado. La solicitud
        no admite empresaId y no exige Lotes ni ubicación de referencia.
      operationId: registrarChacra
      x-use-case: TER-UC-001
      x-business-rules:
        - TER-BR-001
        - TER-BR-002
        - TER-BR-003
        - TER-BR-005
        - TER-BR-007
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRegistrarChacra'
      responses:
        '201':
          description: Chacra registrada
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaChacra'
        '400':
          description: Solicitud con formato o campos no admitidos
          x-error-codes:
            - TER_SOLICITUD_INVALIDA
            - CMN_IDEMPOTENCIA_INVALIDA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaSolicitudInvalida'
        '401':
          description: Sesión ausente, inválida o no vigente
          x-error-codes:
            - ACC_SESION_NO_VIGENTE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaNoAutenticado'
        '403':
          description: Actor sin permiso o soporte sin contexto explícito
          x-error-codes:
            - TER_ACCESO_DENEGADO
            - ACC_CONTEXTO_SOPORTE_REQUERIDO
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaAccesoDenegado'
        '409':
          description: Nombre corto duplicado o conflicto de idempotencia
          x-error-codes:
            - TER_NOMBRE_CORTO_DUPLICADO
            - CMN_IDEMPOTENCIA_CONFLICTO
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaConflictoRegistro'
        '422':
          description: Regla de registro incumplida
          x-error-codes:
            - TER_NOMBRE_OBLIGATORIO
            - TER_NOMBRE_CORTO_OBLIGATORIO
            - TER_EMPRESA_REQUERIDA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaRegistroInvalido'

  /chacras/{chacraId}:
    parameters:
      - $ref: '#/components/parameters/ChacraId'
    get:
      tags:
        - Chacras
      summary: Consultar una Chacra
      description: >-
        Obtiene la ficha descriptiva y la versión de una Chacra existente dentro del alcance
        autorizado. Permite consultar Chacras INACTIVAS según TER-BR-008.
      operationId: consultarChacra
      x-use-case: TER-UC-002
      x-business-rules:
        - TER-BR-004
        - TER-BR-008
      responses:
        '200':
          description: Ficha de la Chacra
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaChacra'
        '400':
          description: Identificador de Chacra con formato inválido
          x-error-codes:
            - TER_SOLICITUD_INVALIDA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaSolicitudInvalida'
        '401':
          description: Sesión ausente, inválida o no vigente
          x-error-codes:
            - ACC_SESION_NO_VIGENTE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaNoAutenticado'
        '403':
          description: Actor sin permiso, fuera de alcance o soporte sin contexto explícito
          x-error-codes:
            - TER_ACCESO_DENEGADO
            - ACC_CONTEXTO_SOPORTE_REQUERIDO
            - TER_CHACRA_FUERA_DE_ALCANCE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaAccesoDenegado'
        '404':
          description: Chacra inexistente dentro del alcance autorizado
          x-error-codes:
            - TER_CHACRA_NO_ENCONTRADA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaChacraNoEncontrada'
    patch:
      tags:
        - Chacras
      summary: Modificar una Chacra
      description: >-
        Modifica uno o más datos descriptivos. Un campo omitido conserva su valor;
        responsableNombre, direccion y puntoGeograficoReferencia admiten null para limpiarlos.
        No cambia la Empresa, la identidad ni el estado.
      operationId: modificarChacra
      x-use-case: TER-UC-004
      x-business-rules:
        - TER-BR-001
        - TER-BR-002
        - TER-BR-007
        - TER-BR-008
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudModificarChacra'
      responses:
        '200':
          description: Chacra modificada
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaChacra'
        '400':
          description: Solicitud o cabecera If-Match inválida
          x-error-codes:
            - TER_SOLICITUD_INVALIDA
            - CMN_IF_MATCH_INVALIDO
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaSolicitudInvalida'
        '401':
          description: Sesión ausente, inválida o no vigente
          x-error-codes:
            - ACC_SESION_NO_VIGENTE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaNoAutenticado'
        '403':
          description: Actor sin permiso o soporte sin contexto explícito
          x-error-codes:
            - TER_ACCESO_DENEGADO
            - ACC_CONTEXTO_SOPORTE_REQUERIDO
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaAccesoDenegado'
        '404':
          description: Chacra inexistente dentro del alcance autorizado
          x-error-codes:
            - TER_CHACRA_NO_ENCONTRADA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaChacraNoEncontrada'
        '409':
          description: Nombre corto duplicado o versión anterior a la vigente
          x-error-codes:
            - TER_NOMBRE_CORTO_DUPLICADO
            - TER_VERSION_CONFLICTO
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaConflictoModificacion'
        '428':
          description: La cabecera If-Match es obligatoria
          x-error-codes:
            - CMN_IF_MATCH_REQUERIDO
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaPrecondicionRequerida'
        '422':
          description: Regla de modificación incumplida
          x-error-codes:
            - TER_NOMBRE_OBLIGATORIO
            - TER_NOMBRE_CORTO_OBLIGATORIO
            - TER_OPERACION_INACTIVA_INVALIDA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaModificacionInvalida'

  /chacras/{chacraId}/inactivar:
    parameters:
      - $ref: '#/components/parameters/ChacraId'
    post:
      tags:
        - Chacras
      summary: Inactivar una Chacra
      description: >-
        Pasa una Chacra ACTIVA a INACTIVA sin borrarla. Rechaza la operación si tiene
        al menos un Lote ACTIVO y nunca aplica una transición en cascada.
      operationId: inactivarChacra
      x-use-case: TER-UC-005
      x-business-rules:
        - TER-BR-005
        - TER-BR-006
        - TER-BR-023
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Chacra inactivada
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaChacra'
        '400':
          description: Cabecera If-Match o solicitud inválida
          x-error-codes:
            - TER_SOLICITUD_INVALIDA
            - CMN_IF_MATCH_INVALIDO
            - CMN_IDEMPOTENCIA_INVALIDA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaSolicitudInvalida'
        '401':
          description: Sesión ausente, inválida o no vigente
          x-error-codes:
            - ACC_SESION_NO_VIGENTE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaNoAutenticado'
        '403':
          description: Actor sin permiso o soporte sin contexto explícito
          x-error-codes:
            - TER_ACCESO_DENEGADO
            - ACC_CONTEXTO_SOPORTE_REQUERIDO
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaAccesoDenegado'
        '404':
          description: Chacra inexistente dentro del alcance autorizado
          x-error-codes:
            - TER_CHACRA_NO_ENCONTRADA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaChacraNoEncontrada'
        '409':
          description: Versión anterior o conflicto de idempotencia
          x-error-codes:
            - TER_VERSION_CONFLICTO
            - CMN_IDEMPOTENCIA_CONFLICTO
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaConflictoInactivacion'
        '428':
          description: La cabecera If-Match es obligatoria
          x-error-codes:
            - CMN_IF_MATCH_REQUERIDO
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaPrecondicionRequerida'
        '422':
          description: Transición inválida o existencia de Lotes activos
          x-error-codes:
            - TER_TRANSICION_ESTADO_INVALIDA
            - TER_ESTADO_CHACRA_LOTES_INCOMPATIBLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaInactivacionInvalida'

  /chacras/{chacraId}/lotes:
    parameters:
      - $ref: '#/components/parameters/ChacraId'
    post:
      tags:
        - Lotes
      summary: Registrar un Lote en una Chacra
      description: >-
        Registra un Lote ACTIVO dentro de la Chacra autorizada. Puede crearse SIN_DELIMITAR
        o con delimitación inicial. Si incluye geometría, valida no superposición espacial
        en PostGIS y calcula automáticamente la superficie en hectáreas.
      operationId: registrarLote
      x-use-case: TER-UC-006
      x-business-rules:
        - TER-BR-009
        - TER-BR-010
        - TER-BR-011
        - TER-BR-012
        - TER-BR-013
        - TER-BR-014
        - TER-BR-015
        - TER-BR-016
        - TER-BR-017
        - TER-BR-020
        - TER-BR-021
        - TER-BR-023
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRegistrarLote'
      responses:
        '201':
          description: Lote registrado
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLote'
        '400':
          description: Solicitud con formato o campos no admitidos
          x-error-codes:
            - TER_SOLICITUD_INVALIDA
            - CMN_IDEMPOTENCIA_INVALIDA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaSolicitudInvalida'
        '401':
          description: Sesión ausente, inválida o no vigente
          x-error-codes:
            - ACC_SESION_NO_VIGENTE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaNoAutenticado'
        '403':
          description: Actor sin permiso o soporte sin contexto explícito
          x-error-codes:
            - TER_ACCESO_DENEGADO
            - ACC_CONTEXTO_SOPORTE_REQUERIDO
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaAccesoDenegado'
        '404':
          description: Chacra no encontrada en el alcance autorizado
          x-error-codes:
            - TER_CHACRA_NO_ENCONTRADA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaChacraNoEncontrada'
        '409':
          description: Código duplicado en la Chacra, superposición espacial o conflicto de idempotencia
          x-error-codes:
            - TER_CODIGO_LOTE_DUPLICADO
            - TER_LOTES_SUPERPUESTOS
            - CMN_IDEMPOTENCIA_CONFLICTO
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaConflictoLote'
        '422':
          description: Regla de registro de Lote incumplida
          x-error-codes:
            - TER_CHACRA_LOTE_INVALIDA
            - TER_NOMBRE_LOTE_INVALIDO
            - TER_CODIGO_LOTE_INVALIDO
            - TER_GEOMETRIA_LOTE_INVALIDA
            - TER_SUPERFICIE_LOTE_INVALIDA
            - TER_VERSION_GEOMETRICA_INVALIDA
            - TER_TIPO_SUELO_INVALIDO
            - TER_SISTEMA_RIEGO_INVALIDO
            - TER_ESTADO_CHACRA_LOTES_INCOMPATIBLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaRegistroLoteInvalido'
    get:
      tags:
        - Lotes
      summary: Listar Lotes de una Chacra
      description: >-
        Lista los Lotes pertenecientes a una Chacra dentro del alcance autorizado.
        Admite filtros por estado, paginación en base de datos y orden determinista.
      operationId: listarLotesPorChacra
      x-use-case: TER-UC-008
      x-business-rules:
        - TER-BR-018
        - TER-BR-022
      parameters:
        - name: limite
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: desplazamiento
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoLote'
        - name: condicionGeometrica
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CondicionGeometricaLote'
        - name: orden
          in: query
          required: false
          schema:
            type: string
            enum:
              - nombre:asc
              - nombre:desc
              - codigo:asc
              - codigo:desc
              - creadoEn:asc
              - creadoEn:desc
            default: creadoEn:desc
      responses:
        '200':
          description: Página de Lotes de la Chacra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaLotes'
        '400':
          description: Parámetros de consulta inválidos
          x-error-codes:
            - TER_CONSULTA_INVALIDA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaConsultaInvalida'
        '401':
          description: Sesión no vigente
          x-error-codes:
            - ACC_SESION_NO_VIGENTE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaNoAutenticado'
        '403':
          description: Actor sin permiso o fuera de alcance
          x-error-codes:
            - TER_ACCESO_DENEGADO
            - ACC_CONTEXTO_SOPORTE_REQUERIDO
            - TER_CHACRA_FUERA_DE_ALCANCE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaAccesoDenegado'
        '404':
          description: Chacra no encontrada
          x-error-codes:
            - TER_CHACRA_NO_ENCONTRADA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaChacraNoEncontrada'

  /lotes:
    get:
      tags:
        - Lotes
      summary: Listar Lotes de la Empresa
      description: >-
        Lista todos los Lotes de la Empresa autorizada. Si el actor es Capataz,
        restringe el resultado a las Chacras asignadas según TER-BR-022.
      operationId: listarLotes
      x-use-case: TER-UC-008
      x-business-rules:
        - TER-BR-018
        - TER-BR-022
      parameters:
        - name: chacraId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limite
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: desplazamiento
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoLote'
        - name: condicionGeometrica
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CondicionGeometricaLote'
        - name: orden
          in: query
          required: false
          schema:
            type: string
            enum:
              - nombre:asc
              - nombre:desc
              - codigo:asc
              - codigo:desc
              - creadoEn:asc
              - creadoEn:desc
            default: creadoEn:desc
      responses:
        '200':
          description: Página de Lotes autorizados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaLotes'
        '400':
          description: Parámetros de consulta inválidos
          x-error-codes:
            - TER_CONSULTA_INVALIDA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaConsultaInvalida'
        '401':
          description: Sesión no vigente
          x-error-codes:
            - ACC_SESION_NO_VIGENTE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaNoAutenticado'
        '403':
          description: Actor sin permiso
          x-error-codes:
            - TER_ACCESO_DENEGADO
            - ACC_CONTEXTO_SOPORTE_REQUERIDO
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaAccesoDenegado'

  /lotes/{loteId}:
    parameters:
      - $ref: '#/components/parameters/LoteId'
    get:
      tags:
        - Lotes
      summary: Consultar un Lote
      description: >-
        Obtiene la ficha territorial, condición geométrica y superficie oficial vigente de un Lote.
      operationId: consultarLote
      x-use-case: TER-UC-007
      x-business-rules:
        - TER-BR-018
        - TER-BR-022
      responses:
        '200':
          description: Ficha del Lote
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLote'
        '400':
          description: Identificador inválido
          x-error-codes:
            - TER_SOLICITUD_INVALIDA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaSolicitudInvalida'
        '401':
          description: Sesión no vigente
          x-error-codes:
            - ACC_SESION_NO_VIGENTE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaNoAutenticado'
        '403':
          description: Actor sin permiso o Lote fuera del alcance asignado
          x-error-codes:
            - TER_ACCESO_DENEGADO
            - ACC_CONTEXTO_SOPORTE_REQUERIDO
            - TER_LOTE_FUERA_DE_ALCANCE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaAccesoDenegado'
        '404':
          description: Lote no encontrado
          x-error-codes:
            - TER_LOTE_NO_ENCONTRADO
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaLoteNoEncontrado'
    patch:
      tags:
        - Lotes
      summary: Modificar datos descriptivos de un Lote
      description: >-
        Modifica nombre, descripción, notas, tipo de suelo o sistema de riego.
