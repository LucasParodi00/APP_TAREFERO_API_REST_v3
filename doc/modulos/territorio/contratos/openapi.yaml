components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ChacraId:
      name: chacraId
      in: path
      required: true
      description: Identificador de la Chacra dentro de la Empresa autorizada
      schema:
        type: string
        format: uuid
    LoteId:
      name: loteId
      in: path
      required: true
      description: Identificador del Lote dentro de la Empresa autorizada
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag fuerte de la versión conocida, por ejemplo `"3"`
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Clave opaca que identifica el reintento de la misma escritura
      schema:
        type: string
        minLength: 1
        maxLength: 255

  headers:
    ETag:
      description: ETag fuerte que representa la versión vigente del recurso
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'

  schemas:
    SolicitudRegistrarChacra:
      type: object
      additionalProperties: false
      required:
        - nombre
        - nombreCorto
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        nombreCorto:
          type: string
          minLength: 1
          maxLength: 50
        responsableNombre:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 150
        direccion:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 500
        puntoGeograficoReferencia:
          oneOf:
            - $ref: '#/components/schemas/PuntoGeograficoReferencia'
            - type: 'null'

    SolicitudModificarChacra:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        nombreCorto:
          type: string
          minLength: 1
          maxLength: 50
        responsableNombre:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 150
        direccion:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 500
        puntoGeograficoReferencia:
          oneOf:
            - $ref: '#/components/schemas/PuntoGeograficoReferencia'
            - type: 'null'

    PuntoGeograficoReferencia:
      type: object
      additionalProperties: false
      required:
        - latitud
        - longitud
      properties:
        latitud:
          type: number
          minimum: -90
          maximum: 90
        longitud:
          type: number
          minimum: -180
          maximum: 180

    EstadoChacra:
      type: string
      enum:
        - ACTIVA
        - INACTIVA

    RespuestaChacra:
      type: object
      additionalProperties: false
      required:
        - id
        - nombre
        - nombreCorto
        - responsableNombre
        - direccion
        - puntoGeograficoReferencia
        - estado
        - creadoEn
        - actualizadoEn
        - version
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          maxLength: 150
        nombreCorto:
          type: string
          maxLength: 50
        responsableNombre:
          type:
            - string
            - 'null'
          maxLength: 150
        direccion:
          type:
            - string
            - 'null'
          maxLength: 500
        puntoGeograficoReferencia:
          oneOf:
            - $ref: '#/components/schemas/PuntoGeograficoReferencia'
            - type: 'null'
        estado:
          $ref: '#/components/schemas/EstadoChacra'
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1

    PaginacionRespuesta:
      type: object
      additionalProperties: false
      required:
        - limite
        - desplazamiento
        - total
      properties:
        limite:
          type: integer
          minimum: 1
          maximum: 100
        desplazamiento:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0

    PaginaChacras:
      type: object
      additionalProperties: false
      required:
        - datos
        - paginacion
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/RespuestaChacra'
        paginacion:
          $ref: '#/components/schemas/PaginacionRespuesta'

    ErrorCampo:
      type: object
      additionalProperties: false
      required:
        - campo
        - code
        - mensaje
      properties:
        campo:
          type: string
        code:
          type: string
        mensaje:
          type: string

    Problema:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - detail
        - instance
        - solicitudId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: '^(TER|ACC|CMN)_[A-Z0-9_]+$'
        detail:
          type: string
        instance:
          type: string
        solicitudId:
          type: string
          format: uuid
        errores:
          type: array
          items:
            $ref: '#/components/schemas/ErrorCampo'

    ProblemaSolicitudInvalida:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            status:
              const: 400
            code:
              enum:
                - TER_SOLICITUD_INVALIDA
                - CMN_IF_MATCH_INVALIDO
                - CMN_IDEMPOTENCIA_INVALIDA

    ProblemaConsultaInvalida:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            status:
              const: 400
            code:
              const: TER_CONSULTA_INVALIDA

    ProblemaNoAutenticado:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            status:
              const: 401
            code:
              const: ACC_SESION_NO_VIGENTE

    ProblemaAccesoDenegado:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            status:
              const: 403
            code:
              enum:
                - TER_ACCESO_DENEGADO
                - ACC_CONTEXTO_SOPORTE_REQUERIDO
                - TER_CHACRA_FUERA_DE_ALCANCE
                - TER_LOTE_FUERA_DE_ALCANCE

    ProblemaChacraNoEncontrada:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            status:
              const: 404
            code:
              const: TER_CHACRA_NO_ENCONTRADA

    ProblemaConflictoRegistro:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            status:
              const: 409
            code:
              enum:
                - TER_NOMBRE_CORTO_DUPLICADO
                - CMN_IDEMPOTENCIA_CONFLICTO

    ProblemaRegistroInvalido:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            status:
              const: 422
            code:
              enum:
                - TER_NOMBRE_OBLIGATORIO
                - TER_NOMBRE_CORTO_OBLIGATORIO
                - TER_EMPRESA_REQUERIDA

    ProblemaConflictoModificacion:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            status:
              const: 409
            code:
              enum:
                - TER_NOMBRE_CORTO_DUPLICADO
                - TER_VERSION_CONFLICTO

    ProblemaModificacionInvalida:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            status:
              const: 422
            code:
              enum:
                - TER_NOMBRE_OBLIGATORIO
                - TER_NOMBRE_CORTO_OBLIGATORIO
                - TER_OPERACION_INACTIVA_INVALIDA

    ProblemaConflictoInactivacion:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            status:
              const: 409
            code:
              enum:
                - TER_VERSION_CONFLICTO
                - CMN_IDEMPOTENCIA_CONFLICTO

    ProblemaPrecondicionRequerida:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            status:
              const: 428
            code:
              const: CMN_IF_MATCH_REQUERIDO

    ProblemaInactivacionInvalida:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            status:
              const: 422
            code:
              enum:
                - TER_TRANSICION_ESTADO_INVALIDA
                - TER_ESTADO_CHACRA_LOTES_INCOMPATIBLE

    TipoSuelo:
      type: string
      enum:
        - ARCILLOSO
        - ARENOSO
        - LIMOSO
        - FRANCO
        - MIXTO
        - OTRO

    SistemaRiegoPrincipal:
      type: string
      enum:
        - SIN_RIEGO
        - GOTEO
        - ASPERSION
        - MICROASPERSION
        - GRAVEDAD
        - OTRO

    EstadoLote:
      type: string
      enum:
        - ACTIVO
        - INACTIVO

    CondicionGeometricaLote:
      type: string
      enum:
        - SIN_DELIMITAR
        - DELIMITADO

    GeoJsonPolygon:
      type: object
      additionalProperties: false
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
