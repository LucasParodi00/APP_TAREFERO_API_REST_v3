openapi: "3.1.0"
info:
  title: "Tarefero API REST — Contexto productivo"
  version: "0.1.0"
  description: "Propuesta para PLAN-CUL-0001. El alcance y los cambios pendientes se describen en §7 del plan."
  contact:
    name: "Tarefero"
servers:
  -
    url: "/api/v1"
tags:
  -
    name: "Catálogo productivo"
    description: "Administración de Cultivos y Variedades globales."
  -
    name: "Perfiles de cultivo"
    description: "Mantenimiento de versiones de Perfil en el alcance autorizado."
security:
  -
    Autenticacion: []
paths:
  "/cultivos":
    get:
      tags: ["Catálogo productivo"]
      summary: "Listar Cultivos"
      description: "Consulta el catálogo global paginado."
      operationId: "listarCultivos"
      x-use-case: "CUL-UC-001"
      x-business-rules: ["CUL-BR-001","CUL-BR-002","CUL-BR-022"]
      parameters:
        -
          $ref: "#/components/parameters/Limite"
        -
          $ref: "#/components/parameters/Desplazamiento"
        -
          name: "estado"
          in: "query"
          schema:
            $ref: "#/components/schemas/EstadoCultivo"
        -
          $ref: "#/components/parameters/OrdenCatalogo"
      responses:
        "200":
          description: "Página de Cultivos."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ListadoCultivos"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    post:
      tags: ["Catálogo productivo"]
      summary: "Registrar Cultivo"
      description: "Crea un Cultivo del catálogo global."
      operationId: "registrarCultivo"
      x-use-case: "CUL-UC-001"
      x-business-rules: ["CUL-BR-001","CUL-BR-002","CUL-BR-022"]
      parameters:
        -
          $ref: "#/components/parameters/ClaveIdempotencia"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SolicitudCrearCultivo"
      responses:
        "201":
          description: "Cultivo registrado."
          headers:
            ETag:
              $ref: "#/components/headers/VersionRecurso"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Cultivo"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "409":
          description: "Cultivo duplicado o clave de idempotencia en conflicto."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problema"
                  -
                    properties:
                      code:
                        enum: ["CUL_CULTIVO_DUPLICADO","CUL_IDEMPOTENCIA_CONFLICTO"]
        "500":
          $ref: "#/components/responses/ErrorInterno"
  "/cultivos/{cultivoId}":
    parameters:
      -
        $ref: "#/components/parameters/CultivoId"
    get:
      tags: ["Catálogo productivo"]
      summary: "Consultar Cultivo"
      description: "Devuelve la ficha administrativa de un Cultivo."
      operationId: "consultarCultivo"
      x-use-case: "CUL-UC-001"
      x-business-rules: ["CUL-BR-001","CUL-BR-002","CUL-BR-022"]
      responses:
        "200":
          description: "Ficha de Cultivo."
          headers:
            ETag:
              $ref: "#/components/headers/VersionRecurso"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Cultivo"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "404":
          $ref: "#/components/responses/RecursoNoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
  "/cultivos/{cultivoId}/inactivaciones":
    parameters:
      -
        $ref: "#/components/parameters/CultivoId"
    post:
      tags: ["Catálogo productivo"]
      summary: "Inactivar Cultivo"
      description: "Registra la inactivación de un Cultivo."
      operationId: "inactivarCultivo"
      x-use-case: "CUL-UC-001"
      x-business-rules: ["CUL-BR-001","CUL-BR-002","CUL-BR-022"]
      parameters:
        -
          $ref: "#/components/parameters/ClaveIdempotencia"
        -
          $ref: "#/components/parameters/SiCoincideVersion"
      responses:
        "200":
          description: "Cultivo actualizado."
          headers:
            ETag:
              $ref: "#/components/headers/VersionRecurso"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Cultivo"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "404":
          $ref: "#/components/responses/RecursoNoEncontrado"
        "409":
          description: "Conflicto al inactivar el Cultivo."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problema"
                  -
                    properties:
                      code:
                        enum: ["CUL_VERSION_CONFLICTO","CUL_IDEMPOTENCIA_CONFLICTO","CUL_REGISTRO_HISTORICO_EN_USO"]
        "500":
          $ref: "#/components/responses/ErrorInterno"
  "/cultivos/{cultivoId}/variedades":
    parameters:
      -
        $ref: "#/components/parameters/CultivoId"
    get:
      tags: ["Catálogo productivo"]
      summary: "Listar Variedades"
      description: "Consulta las Variedades de un Cultivo en forma paginada."
      operationId: "listarVariedades"
      x-use-case: "CUL-UC-001"
      x-business-rules: ["CUL-BR-001","CUL-BR-002","CUL-BR-022"]
      parameters:
        -
          $ref: "#/components/parameters/Limite"
        -
          $ref: "#/components/parameters/Desplazamiento"
        -
          name: "estado"
          in: "query"
          schema:
            $ref: "#/components/schemas/EstadoVariedad"
        -
          $ref: "#/components/parameters/OrdenCatalogo"
      responses:
        "200":
          description: "Página de Variedades."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ListadoVariedades"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "404":
          $ref: "#/components/responses/RecursoNoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    post:
      tags: ["Catálogo productivo"]
      summary: "Registrar Variedad"
      description: "Registra una Variedad en el Cultivo indicado."
      operationId: "registrarVariedad"
      x-use-case: "CUL-UC-001"
      x-business-rules: ["CUL-BR-001","CUL-BR-002","CUL-BR-022"]
      parameters:
        -
          $ref: "#/components/parameters/ClaveIdempotencia"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SolicitudCrearVariedad"
      responses:
        "201":
          description: "Variedad registrada."
          headers:
            ETag:
              $ref: "#/components/headers/VersionRecurso"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Variedad"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "404":
          $ref: "#/components/responses/RecursoNoEncontrado"
        "409":
          description: "Duplicado o conflicto de idempotencia."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problema"
                  -
                    properties:
                      code:
                        enum: ["CUL_VARIEDAD_INVALIDA","CUL_IDEMPOTENCIA_CONFLICTO"]
        "422":
          description: "Variedad incompatible con el Cultivo."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problema"
                  -
                    properties:
                      code:
                        enum: ["CUL_VARIEDAD_INVALIDA"]
        "500":
          $ref: "#/components/responses/ErrorInterno"
  "/cultivos/{cultivoId}/variedades/{variedadId}":
    parameters:
      -
        $ref: "#/components/parameters/CultivoId"
      -
        $ref: "#/components/parameters/VariedadId"
    get:
      tags: ["Catálogo productivo"]
      summary: "Consultar Variedad"
      description: "Devuelve la ficha administrativa de una Variedad."
      operationId: "consultarVariedad"
      x-use-case: "CUL-UC-001"
      x-business-rules: ["CUL-BR-001","CUL-BR-002","CUL-BR-022"]
      responses:
        "200":
          description: "Ficha de Variedad."
          headers:
            ETag:
              $ref: "#/components/headers/VersionRecurso"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Variedad"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "404":
          $ref: "#/components/responses/RecursoNoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
  "/cultivos/{cultivoId}/variedades/{variedadId}/inactivaciones":
    parameters:
      -
        $ref: "#/components/parameters/CultivoId"
      -
        $ref: "#/components/parameters/VariedadId"
    post:
      tags: ["Catálogo productivo"]
      summary: "Inactivar Variedad"
      description: "Registra la inactivación de la Variedad."
      operationId: "inactivarVariedad"
      x-use-case: "CUL-UC-001"
      x-business-rules: ["CUL-BR-001","CUL-BR-002","CUL-BR-022"]
      parameters:
        -
          $ref: "#/components/parameters/ClaveIdempotencia"
        -
          $ref: "#/components/parameters/SiCoincideVersion"
      responses:
        "200":
          description: "Variedad actualizada."
          headers:
            ETag:
              $ref: "#/components/headers/VersionRecurso"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Variedad"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "404":
          $ref: "#/components/responses/RecursoNoEncontrado"
        "409":
          description: "Conflicto al inactivar la Variedad."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problema"
                  -
                    properties:
                      code:
                        enum: ["CUL_VERSION_CONFLICTO","CUL_IDEMPOTENCIA_CONFLICTO","CUL_REGISTRO_HISTORICO_EN_USO"]
        "500":
          $ref: "#/components/responses/ErrorInterno"
  "/cultivos/{cultivoId}/perfiles-cultivo":
    parameters:
      -
        $ref: "#/components/parameters/CultivoId"
    post:
      tags: ["Perfiles de cultivo"]
      summary: "Crear borrador de Perfil"
      description: "Crea una línea de Perfil o copia una versión existente a un borrador nuevo."
      operationId: "crearBorradorPerfilCultivo"
      x-use-case: "CUL-UC-002"
      x-business-rules: ["CUL-BR-003","CUL-BR-004","CUL-BR-005","CUL-BR-006","CUL-BR-022"]
      x-precision-pendiente: "Habilitación del Cultivo, herencia y versionado según §4 y §7 del plan."
      parameters:
        -
          $ref: "#/components/parameters/ClaveIdempotencia"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SolicitudCrearBorrador"
      responses:
        "201":
          description: "Borrador creado."
          headers:
            ETag:
              $ref: "#/components/headers/VersionRecurso"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PerfilCultivo"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "404":
          $ref: "#/components/responses/RecursoNoEncontrado"
        "409":
          description: "Conflicto de versión, idempotencia o integridad histórica."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problema"
                  -
                    properties:
                      code:
                        enum: ["CUL_VERSION_CONFLICTO","CUL_IDEMPOTENCIA_CONFLICTO","CUL_REGISTRO_HISTORICO_EN_USO"]
        "422":
          description: "Perfil o campo incompatible con las condiciones de la operación."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problema"
                  -
                    properties:
                      code:
                        enum: ["CUL_CULTIVO_NO_HABILITADO","CUL_PERFIL_INCOMPATIBLE","CUL_CAMPO_PERFIL_INVALIDO","CUL_VERSION_PERFIL_INMUTABLE"]
        "500":
          $ref: "#/components/responses/ErrorInterno"
  "/cultivos/{cultivoId}/perfiles-cultivo/{perfilId}":
    parameters:
      -
        $ref: "#/components/parameters/CultivoId"
      -
        $ref: "#/components/parameters/PerfilId"
    get:
      tags: ["Perfiles de cultivo"]
      summary: "Consultar versión de Perfil"
      description: "Recupera la versión individual para mantenimiento dentro del alcance autorizado."
      operationId: "consultarPerfilCultivo"
      x-use-case: "CUL-UC-002"
      x-business-rules: ["CUL-BR-003","CUL-BR-004","CUL-BR-005","CUL-BR-006","CUL-BR-022"]
      x-precision-pendiente: "Lectura de mantenimiento sujeta a revisión en §7."
      responses:
        "200":
          description: "Versión de Perfil."
          headers:
            ETag:
              $ref: "#/components/headers/VersionRecurso"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PerfilCultivo"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "404":
          $ref: "#/components/responses/RecursoNoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    patch:
      tags: ["Perfiles de cultivo"]
      summary: "Modificar borrador de Perfil"
      description: "Actualiza los atributos indicados de un borrador. Si se incluyen campos, sustituye el conjunto del borrador."
      operationId: "modificarBorradorPerfilCultivo"
      x-use-case: "CUL-UC-002"
      x-business-rules: ["CUL-BR-003","CUL-BR-004","CUL-BR-005","CUL-BR-006","CUL-BR-022"]
      parameters:
        -
          $ref: "#/components/parameters/ClaveIdempotencia"
        -
          $ref: "#/components/parameters/SiCoincideVersion"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SolicitudEditarBorrador"
      responses:
        "200":
          description: "Borrador actualizado."
          headers:
            ETag:
              $ref: "#/components/headers/VersionRecurso"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PerfilCultivo"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "404":
          $ref: "#/components/responses/RecursoNoEncontrado"
        "409":
          description: "Conflicto de versión, idempotencia o integridad histórica."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problema"
                  -
                    properties:
                      code:
                        enum: ["CUL_VERSION_CONFLICTO","CUL_IDEMPOTENCIA_CONFLICTO","CUL_REGISTRO_HISTORICO_EN_USO"]
        "422":
          description: "Perfil o campo incompatible con las condiciones de la operación."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problema"
                  -
                    properties:
                      code:
                        enum: ["CUL_CULTIVO_NO_HABILITADO","CUL_PERFIL_INCOMPATIBLE","CUL_CAMPO_PERFIL_INVALIDO","CUL_VERSION_PERFIL_INMUTABLE"]
        "500":
          $ref: "#/components/responses/ErrorInterno"
  "/cultivos/{cultivoId}/perfiles-cultivo/{perfilId}/publicaciones":
    parameters:
      -
        $ref: "#/components/parameters/CultivoId"
      -
        $ref: "#/components/parameters/PerfilId"
    post:
      tags: ["Perfiles de cultivo"]
      summary: "Publicar versión de Perfil"
      description: "Publica la versión indicada del borrador."
      operationId: "publicarPerfilCultivo"
      x-use-case: "CUL-UC-002"
      x-business-rules: ["CUL-BR-003","CUL-BR-004","CUL-BR-005","CUL-BR-006","CUL-BR-022"]
      x-precision-pendiente: "Correspondencia de errores de precedencia y campos según §7."
      parameters:
        -
          $ref: "#/components/parameters/ClaveIdempotencia"
        -
          $ref: "#/components/parameters/SiCoincideVersion"
      responses:
        "200":
          description: "Versión publicada."
          headers:
            ETag:
              $ref: "#/components/headers/VersionRecurso"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PerfilCultivo"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "404":
          $ref: "#/components/responses/RecursoNoEncontrado"
        "409":
          description: "Conflicto de versión, idempotencia o integridad histórica."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problema"
                  -
                    properties:
                      code:
                        enum: ["CUL_VERSION_CONFLICTO","CUL_IDEMPOTENCIA_CONFLICTO","CUL_REGISTRO_HISTORICO_EN_USO"]
        "422":
          description: "Perfil o campo incompatible con las condiciones de la operación."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problema"
                  -
                    properties:
                      code:
                        enum: ["CUL_CULTIVO_NO_HABILITADO","CUL_PERFIL_INCOMPATIBLE","CUL_CAMPO_PERFIL_INVALIDO","CUL_VERSION_PERFIL_INMUTABLE"]
        "500":
          $ref: "#/components/responses/ErrorInterno"
  "/cultivos/{cultivoId}/perfiles-cultivo/{perfilId}/inactivaciones":
    parameters:
      -
        $ref: "#/components/parameters/CultivoId"
      -
        $ref: "#/components/parameters/PerfilId"
    post:
      tags: ["Perfiles de cultivo"]
      summary: "Inactivar versión de Perfil"
      description: "Actualiza la disponibilidad de una versión publicada."
      operationId: "inactivarPerfilCultivo"
      x-use-case: "CUL-UC-002"
      x-business-rules: ["CUL-BR-003","CUL-BR-004","CUL-BR-005","CUL-BR-006","CUL-BR-022"]
      x-precision-pendiente: "Transición sujeta a revisión en §7."
      parameters:
        -
          $ref: "#/components/parameters/ClaveIdempotencia"
        -
          $ref: "#/components/parameters/SiCoincideVersion"
      responses:
        "200":
          description: "Versión inactivada."
          headers:
            ETag:
              $ref: "#/components/headers/VersionRecurso"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PerfilCultivo"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "404":
          $ref: "#/components/responses/RecursoNoEncontrado"
        "409":
          description: "Conflicto de versión, idempotencia o integridad histórica."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problema"
                  -
                    properties:
                      code:
                        enum: ["CUL_VERSION_CONFLICTO","CUL_IDEMPOTENCIA_CONFLICTO","CUL_REGISTRO_HISTORICO_EN_USO"]
        "422":
          description: "Perfil o campo incompatible con las condiciones de la operación."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problema"
                  -
                    properties:
                      code:
                        enum: ["CUL_CULTIVO_NO_HABILITADO","CUL_PERFIL_INCOMPATIBLE","CUL_CAMPO_PERFIL_INVALIDO","CUL_VERSION_PERFIL_INMUTABLE"]
        "500":
          $ref: "#/components/responses/ErrorInterno"
components:
  securitySchemes:
    Autenticacion:
      type: "http"
      scheme: "bearer"
      description: "Credencial verificada por Identidad y Acceso."
  parameters:
    CultivoId:
      name: "cultivoId"
      in: "path"
      required: true
      description: "Identificador del Cultivo."
      schema:
        $ref: "#/components/schemas/Identificador"
    VariedadId:
      name: "variedadId"
      in: "path"
      required: true
      description: "Identificador de la Variedad."
      schema:
        $ref: "#/components/schemas/Identificador"
    PerfilId:
      name: "perfilId"
      in: "path"
      required: true
      description: "Identificador de la versión de Perfil."
      schema:
        $ref: "#/components/schemas/Identificador"
    ClaveIdempotencia:
      name: "Idempotency-Key"
      in: "header"
      description: "Clave de reintento de la operación."
      schema:
        type: "string"
        minLength: 1
    SiCoincideVersion:
      name: "If-Match"
      in: "header"
      required: true
      description: "ETag de la representación consultada."
      schema:
        $ref: "#/components/schemas/EtiquetaVersion"
    Limite:
      name: "limite"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 25
    Desplazamiento:
      name: "desplazamiento"
      in: "query"
      schema:
        type: "integer"
        minimum: 0
        default: 0
    OrdenCatalogo:
      name: "orden"
      in: "query"
      description: "El identificador ascendente desempata el orden."
      schema:
        type: "string"
        enum: ["nombre:asc","nombre:desc","codigo:asc","codigo:desc"]
        default: "nombre:asc"
  headers:
    VersionRecurso:
      required: true
      description: "Versión HTTP de la representación."
      schema:
        $ref: "#/components/schemas/EtiquetaVersion"
  responses:
    FormatoInvalido:
      description: "Solicitud con formato inválido."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problema"
    AutenticacionInvalida:
      description: "Autenticación ausente o inválida."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problema"
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: "string"
    AccesoDenegado:
      description: "Acceso denegado."
      content:
        "application/problem+json":
          schema:
            allOf:
              -
                $ref: "#/components/schemas/Problema"
              -
                properties:
                  code:
                    enum: ["CUL_ACCESO_DENEGADO"]
    RecursoNoEncontrado:
      description: "Recurso ausente en el alcance autorizado."
      content:
        "application/problem+json":
          schema:
            allOf:
              -
                $ref: "#/components/schemas/Problema"
              -
                properties:
                  code:
                    enum: ["CUL_RECURSO_NO_ENCONTRADO"]
    ErrorInterno:
      description: "Error interno con información segura."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problema"
  schemas:
    Identificador:
      type: "string"
      format: "uuid"
    EtiquetaVersion:
      type: "string"
      pattern: "^\"cul-[1-9][0-9]*\"$"
    EstadoCultivo:
      type: "string"
      enum: ["ACTIVO","INACTIVO"]
    EstadoVariedad:
      type: "string"
      enum: ["ACTIVA","INACTIVA"]
    EstadoPerfil:
      type: "string"
      enum: ["BORRADOR","PUBLICADO","INACTIVO"]
    AlcancePerfil:
      type: "string"
      enum: ["BASE","EMPRESA","LOTE"]
    SolicitudCrearCultivo:
      type: "object"
      additionalProperties: false
      required: ["codigo","nombre"]
      properties:
        codigo:
          type: "string"
          minLength: 1
          maxLength: 50
        nombre:
          type: "string"
          minLength: 1
          maxLength: 150
        descripcion:
          type: "string"
          maxLength: 1000
    SolicitudCrearVariedad:
      type: "object"
      additionalProperties: false
      required: ["codigo","nombre"]
      properties:
        codigo:
          type: "string"
          minLength: 1
          maxLength: 50
        nombre:
          type: "string"
          minLength: 1
          maxLength: 150
        descripcion:
          type: "string"
          maxLength: 1000
    Cultivo:
      type: "object"
      additionalProperties: false
      required: ["id","codigo","nombre","estado"]
      properties:
        id:
          $ref: "#/components/schemas/Identificador"
        codigo:
          type: "string"
          minLength: 1
          maxLength: 50
        nombre:
          type: "string"
          minLength: 1
          maxLength: 150
        descripcion:
          type: "string"
          maxLength: 1000
        estado:
          $ref: "#/components/schemas/EstadoCultivo"
    Variedad:
      type: "object"
      additionalProperties: false
      required: ["id","cultivoId","codigo","nombre","estado"]
      properties:
        id:
          $ref: "#/components/schemas/Identificador"
        cultivoId:
          $ref: "#/components/schemas/Identificador"
        codigo:
          type: "string"
          minLength: 1
          maxLength: 50
        nombre:
          type: "string"
          minLength: 1
          maxLength: 150
        descripcion:
          type: "string"
          maxLength: 1000
        estado:
          $ref: "#/components/schemas/EstadoVariedad"
    Paginacion:
      type: "object"
      additionalProperties: false
      required: ["limite","desplazamiento","total"]
      properties:
        limite:
          type: "integer"
          minimum: 1
          maximum: 100
        desplazamiento:
          type: "integer"
          minimum: 0
        total:
          type: "integer"
          minimum: 0
    ListadoCultivos:
      type: "object"
      additionalProperties: false
      required: ["datos","paginacion"]
      properties:
        datos:
          type: "array"
          items:
            $ref: "#/components/schemas/Cultivo"
        paginacion:
          $ref: "#/components/schemas/Paginacion"
    ListadoVariedades:
      type: "object"
      additionalProperties: false
      required: ["datos","paginacion"]
      properties:
        datos:
          type: "array"
          items:
            $ref: "#/components/schemas/Variedad"
        paginacion:
          $ref: "#/components/schemas/Paginacion"
    CampoPerfilComun:
      type: "object"
      required: ["codigo","nombre","destino","obligatorio"]
      properties:
        codigo:
          type: "string"
          minLength: 1
          maxLength: 100
        nombre:
          type: "string"
          minLength: 1
          maxLength: 150
        descripcion:
          type: "string"
          maxLength: 1000
        destino:
          type: "string"
          enum: ["IMPLANTACION","CICLO","LABOR","OBSERVACION","COSECHA"]
        obligatorio:
          type: "boolean"
    CampoTexto:
      type: "object"
      required: ["tipo"]
      properties:
        tipo:
          const: "TEXTO"
        validaciones:
          type: "object"
          additionalProperties: false
          properties:
            longitudMinima:
              type: "integer"
              minimum: 0
            longitudMaxima:
              type: "integer"
              minimum: 0
    CampoEntero:
      type: "object"
      required: ["tipo"]
      properties:
        tipo:
          const: "ENTERO"
        validaciones:
          type: "object"
          additionalProperties: false
          properties:
            minimo:
              type: "integer"
            maximo:
              type: "integer"
    CampoDecimal:
      type: "object"
      required: ["tipo","unidadId"]
      properties:
        tipo:
          const: "DECIMAL"
        unidadId:
          $ref: "#/components/schemas/Identificador"
        validaciones:
          type: "object"
          additionalProperties: false
          properties:
            minimo:
              type: "string"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
            maximo:
              type: "string"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
    CampoBooleano:
      type: "object"
      required: ["tipo"]
      properties:
        tipo:
          const: "BOOLEANO"
    CampoFecha:
      type: "object"
      required: ["tipo"]
      properties:
        tipo:
          const: "FECHA"
        validaciones:
          type: "object"
          additionalProperties: false
          properties:
            minimo:
              type: "string"
              format: "date"
            maximo:
              type: "string"
              format: "date"
    CampoSeleccion:
      type: "object"
      required: ["tipo","validaciones"]
      properties:
        tipo:
          const: "SELECCION"
        validaciones:
          type: "object"
          additionalProperties: false
          required: ["valoresPermitidos"]
          properties:
            valoresPermitidos:
              type: "array"
              items:
                type: "string"
                minLength: 1
              minItems: 1
              uniqueItems: true
    CampoPerfil:
      type: "object"
      allOf:
        -
          $ref: "#/components/schemas/CampoPerfilComun"
        -
          oneOf:
            -
              $ref: "#/components/schemas/CampoTexto"
            -
              $ref: "#/components/schemas/CampoEntero"
            -
              $ref: "#/components/schemas/CampoDecimal"
            -
              $ref: "#/components/schemas/CampoBooleano"
            -
              $ref: "#/components/schemas/CampoFecha"
            -
              $ref: "#/components/schemas/CampoSeleccion"
      unevaluatedProperties: false
    SolicitudPerfilNuevo:
      type: "object"
      additionalProperties: false
      required: ["alcance","nombre","campos"]
      properties:
        alcance:
          $ref: "#/components/schemas/AlcancePerfil"
        loteId:
          $ref: "#/components/schemas/Identificador"
        perfilPadreId:
          $ref: "#/components/schemas/Identificador"
        nombre:
          type: "string"
          minLength: 1
          maxLength: 150
        descripcion:
          type: "string"
          maxLength: 1000
        campos:
          type: "array"
          items:
            $ref: "#/components/schemas/CampoPerfil"
      allOf:
        -
          if:
            properties:
              alcance:
                const: "LOTE"
            required: ["alcance"]
          then:
            required: ["loteId"]
          else:
            not:
              required: ["loteId"]
        -
          if:
            properties:
              alcance:
                const: "BASE"
            required: ["alcance"]
          then:
            not:
              required: ["perfilPadreId"]
          else:
            required: ["perfilPadreId"]
    SolicitudNuevaVersion:
      type: "object"
      additionalProperties: false
      required: ["versionOrigenId"]
      properties:
        versionOrigenId:
          $ref: "#/components/schemas/Identificador"
    SolicitudCrearBorrador:
      oneOf:
        -
          $ref: "#/components/schemas/SolicitudPerfilNuevo"
        -
          $ref: "#/components/schemas/SolicitudNuevaVersion"
    SolicitudEditarBorrador:
      type: "object"
      additionalProperties: false
      properties:
        nombre:
          type: "string"
          minLength: 1
          maxLength: 150
        descripcion:
          type: ["string","null"]
          maxLength: 1000
        campos:
          type: "array"
          items:
            $ref: "#/components/schemas/CampoPerfil"
        perfilPadreId:
          $ref: "#/components/schemas/Identificador"
      minProperties: 1
    PerfilCultivo:
      type: "object"
      additionalProperties: false
      required: ["id","cultivoId","alcance","nombre","campos","version","estado"]
      properties:
        id:
          $ref: "#/components/schemas/Identificador"
        cultivoId:
          $ref: "#/components/schemas/Identificador"
        alcance:
          $ref: "#/components/schemas/AlcancePerfil"
        empresaId:
          $ref: "#/components/schemas/Identificador"
        loteId:
          $ref: "#/components/schemas/Identificador"
        perfilPadreId:
          $ref: "#/components/schemas/Identificador"
        nombre:
          type: "string"
          minLength: 1
          maxLength: 150
        descripcion:
          type: "string"
          maxLength: 1000
        campos:
          type: "array"
          items:
            $ref: "#/components/schemas/CampoPerfil"
        version:
          type: "integer"
          minimum: 1
        estado:
          $ref: "#/components/schemas/EstadoPerfil"
    Problema:
      type: "object"
      required: ["type","title","status","code","detail","instance","solicitudId"]
      properties:
        type:
          type: "string"
          format: "uri-reference"
        title:
          type: "string"
        status:
          type: "integer"
          minimum: 400
          maximum: 599
        code:
          type: "string"
        detail:
          type: "string"
        instance:
          type: "string"
          format: "uri-reference"
        solicitudId:
          $ref: "#/components/schemas/Identificador"
        errores:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required: ["campo","code","mensaje"]
            properties:
              campo:
                type: "string"
              code:
                type: "string"
              mensaje:
                type: "string"
