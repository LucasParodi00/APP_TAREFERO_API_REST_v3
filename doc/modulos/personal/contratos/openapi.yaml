      responses:
        "200":
          $ref: "#/components/responses/FichaActualizada"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "404":
          $ref: "#/components/responses/RecursoNoEncontrado"
        "409":
          $ref: "#/components/responses/ConflictoEscritura"
        "422":
          $ref: "#/components/responses/DisponibilidadInvalida"
        "500":
          $ref: "#/components/responses/ErrorInterno"
components:
  securitySchemes:
    Autenticacion:
      type: "http"
      scheme: "bearer"
      description: "Credencial verificada por Identidad y Acceso."
  parameters:
    EmpleadoId:
      name: "empleadoId"
      in: "path"
      required: true
      description: "Identificador de la ficha laboral."
      schema:
        $ref: "#/components/schemas/Identificador"
    RestriccionId:
      name: "restriccionId"
      in: "path"
      required: true
      description: "Identificador de la Restricción."
      schema:
        $ref: "#/components/schemas/Identificador"
    IndisponibilidadId:
      name: "indisponibilidadId"
      in: "path"
      required: true
      description: "Identificador de la Indisponibilidad."
      schema:
        $ref: "#/components/schemas/Identificador"
    ClaveIdempotencia:
      name: "Idempotency-Key"
      in: "header"
      description: "Clave de reintento de la operación."
      schema:
        type: "string"
        minLength: 1
    SiCoincideVersion:
      name: "If-Match"
      in: "header"
      required: true
      description: "ETag de la ficha laboral consultada."
      schema:
        $ref: "#/components/schemas/EtiquetaFicha"
    Limite:
      name: "limite"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 25
    Desplazamiento:
      name: "desplazamiento"
      in: "query"
      schema:
        type: "integer"
        minimum: 0
        default: 0
  headers:
    CachePrivada:
      required: true
      description: "Control de caché para datos privados."
      schema:
        type: "string"
        const: "no-store"
    VersionFicha:
      required: true
      description: "Versión de la representación de ficha laboral."
      schema:
        $ref: "#/components/schemas/EtiquetaFicha"
  responses:
    FichaActualizada:
      description: "Ficha laboral de la Empresa autorizada."
      headers:
        Cache-Control:
          $ref: "#/components/headers/CachePrivada"
        ETag:
          $ref: "#/components/headers/VersionFicha"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/FichaEmpleado"
    FormatoInvalido:
      description: "Solicitud con formato inválido."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problema"
    AutenticacionInvalida:
      description: "Autenticación ausente o inválida."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problema"
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: "string"
    AccesoDenegado:
      description: "Acceso denegado."
      content:
        "application/problem+json":
          schema:
            allOf:
              -
                $ref: "#/components/schemas/Problema"
              -
                properties:
                  code:
                    enum: ["PER_ACCESO_DENEGADO"]
    RecursoNoEncontrado:
      description: "Recurso ausente dentro del alcance autorizado."
      content:
        "application/problem+json":
          schema:
            allOf:
              -
                $ref: "#/components/schemas/Problema"
              -
                properties:
                  code:
                    enum: ["PER_RECURSO_NO_ENCONTRADO"]
    DatosFichaInvalidos:
      description: "Datos de ficha o referencias inválidos."
      content:
        "application/problem+json":
          schema:
            allOf:
              -
                $ref: "#/components/schemas/Problema"
              -
                properties:
                  code:
                    enum: ["PER_TENANT_INVALIDO","PER_EMPLEADO_INVALIDO","PER_DATO_PERSONAL_INVALIDO"]
    ConflictoEscritura:
      description: "Conflicto de versión o idempotencia."
      content:
        "application/problem+json":
          schema:
            allOf:
              -
                $ref: "#/components/schemas/Problema"
              -
                properties:
                  code:
                    enum: ["PER_VERSION_CONFLICTO","PER_IDEMPOTENCIA_CONFLICTO"]
    ConflictoDocumento:
      description: "Documento duplicado o conflicto de escritura."
      content:
        "application/problem+json":
          schema:
            allOf:
              -
                $ref: "#/components/schemas/Problema"
              -
                properties:
                  code:
                    enum: ["PER_DOCUMENTO_DUPLICADO","PER_VERSION_CONFLICTO","PER_IDEMPOTENCIA_CONFLICTO"]
    DisponibilidadInvalida:
      description: "Restricción, indisponibilidad o referencia inválida."
      content:
        "application/problem+json":
          schema:
            allOf:
              -
                $ref: "#/components/schemas/Problema"
              -
                properties:
                  code:
                    enum: ["PER_RESTRICCION_INVALIDA","PER_INDISPONIBILIDAD_INVALIDA","PER_TENANT_INVALIDO","PER_DATO_PERSONAL_INVALIDO"]
    ErrorInactivacion:
      description: "Falla de revocación o error interno con información segura."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problema"
          examples:
            suspensionFallida:
              summary: "Revocación fallida y cambio laboral revertido."
              value:
                type: "about:blank"
                title: "Inactivación sin confirmar"
                status: 500
                code: "PER_SUSPENSION_ACCESO_FALLIDA"
                detail: "No se completó la inactivación."
                instance: "/api/v1/empleados/019a0000-0000-7000-8000-000000000001/inactivaciones"
                solicitudId: "019a0000-0000-7000-8000-000000000002"
    ErrorInterno:
      description: "Error interno con información segura."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problema"
  schemas:
