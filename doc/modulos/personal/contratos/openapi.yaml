        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "404":
          $ref: "#/components/responses/RecursoNoEncontrado"
        "409":
          $ref: "#/components/responses/ConflictoEscritura"
        "422":
          $ref: "#/components/responses/DisponibilidadInvalida"
        "500":
          $ref: "#/components/responses/ErrorInterno"
  "/empleados/{empleadoId}/indisponibilidades/{indisponibilidadId}":
    parameters:
      -
        $ref: "#/components/parameters/EmpleadoId"
      -
        $ref: "#/components/parameters/IndisponibilidadId"
    patch:
      tags: ["Disponibilidad"]
      summary: "Modificar indisponibilidad"
      description: "Actualiza los datos indicados de la indisponibilidad."
      operationId: "modificarIndisponibilidad"
      x-use-case: "PER-UC-003"
      x-business-rules: ["PER-BR-001","PER-BR-004","PER-BR-021","PER-BR-022"]
      parameters:
