        "422":
          $ref: "#/components/responses/DisponibilidadInvalida"
        "500":
          $ref: "#/components/responses/ErrorInterno"
  "/empleados/{empleadoId}/restricciones/{restriccionId}":
    parameters:
      -
        $ref: "#/components/parameters/EmpleadoId"
      -
        $ref: "#/components/parameters/RestriccionId"
    patch:
      tags: ["Disponibilidad"]
      summary: "Modificar restricción"
      description: "Actualiza los datos indicados de la restricción."
      operationId: "modificarRestriccion"
      x-use-case: "PER-UC-003"
      x-business-rules: ["PER-BR-001","PER-BR-004","PER-BR-021","PER-BR-022"]
      parameters:
        -
          $ref: "#/components/parameters/ClaveIdempotencia"
        -
          $ref: "#/components/parameters/SiCoincideVersion"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SolicitudModificarRestriccion"
      responses:
