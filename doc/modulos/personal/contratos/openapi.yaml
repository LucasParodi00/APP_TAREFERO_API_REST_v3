        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    post:
      tags: ["Empleados"]
      summary: "Registrar Especialidad"
      description: "Da de alta una Especialidad para la Empresa autorizada."
      operationId: "registrarEspecialidad"
      x-use-case: "PER-UC-001"
      x-business-rules: ["PER-BR-001","PER-BR-002","PER-BR-003","PER-BR-004","PER-BR-005","PER-BR-006"]
      x-precision-pendiente: "Alta del catálogo sujeta a confirmación en §7."
      parameters:
        -
          $ref: "#/components/parameters/ClaveIdempotencia"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SolicitudRegistrarEspecialidad"
      responses:
        "201":
          description: "Especialidad registrada."
          headers:
            Cache-Control:
              $ref: "#/components/headers/CachePrivada"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Especialidad"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "409":
          $ref: "#/components/responses/ConflictoEscritura"
        "422":
          $ref: "#/components/responses/DatosFichaInvalidos"
        "500":
          $ref: "#/components/responses/ErrorInterno"
  "/empleados/{empleadoId}/restricciones":
    parameters:
