                    $ref: "#/components/schemas/Problema"
                  -
                    properties:
                      code:
                        enum: ["PER_TENANT_INVALIDO","PER_TRANSICION_EMPLEADO_INVALIDA","PER_LIMITE_EMPLEADOS_ALCANZADO"]
        "500":
          $ref: "#/components/responses/ErrorInterno"
  "/especialidades":
    get:
      tags: ["Empleados"]
      summary: "Listar Especialidades"
      description: "Consulta el catálogo de Especialidades de la Empresa, ordenado por nombre e identificador ascendentes."
      operationId: "listarEspecialidades"
      x-use-case: "PER-UC-001"
      x-business-rules: ["PER-BR-001","PER-BR-002","PER-BR-003","PER-BR-004","PER-BR-005","PER-BR-006"]
      x-precision-pendiente: "Consulta administrativa sujeta a confirmación en §7."
      parameters:
        -
          $ref: "#/components/parameters/Limite"
        -
          $ref: "#/components/parameters/Desplazamiento"
      responses:
        "200":
          description: "Página de Especialidades."
          headers:
            Cache-Control:
              $ref: "#/components/headers/CachePrivada"
