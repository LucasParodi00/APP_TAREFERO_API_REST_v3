          maxLength: 150
        numeroDocumento:
          type: "string"
          minLength: 1
          maxLength: 50
        nombre:
          type: "string"
          minLength: 1
          maxLength: 150
        apellido:
          type: "string"
          minLength: 1
          maxLength: 150
        telefonoContacto:
          type: "string"
          minLength: 1
          maxLength: 30
        fechaNacimiento:
          $ref: "#/components/schemas/Fecha"
        domicilio:
          type: "string"
          minLength: 0
          maxLength: 500
        grupoSanguineo:
          type: "string"
