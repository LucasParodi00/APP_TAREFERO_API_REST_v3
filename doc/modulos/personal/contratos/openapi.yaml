openapi: "3.1.0"
info:
  title: "Tarefero API REST — Personal"
  version: "0.1.0"
  description: "Propuesta para PLAN-PER-0001. Las precisiones pendientes se detallan en §7 del plan."
  contact:
    name: "Tarefero"
servers:
  -
    url: "/api/v1"
tags:
  -
    name: "Empleados"
    description: "Administración de fichas laborales y datos auxiliares."
  -
    name: "Disponibilidad"
    description: "Administración de restricciones e indisponibilidades."
security:
  -
    Autenticacion: []
paths:
  "/empleados":
    get:
      tags: ["Empleados"]
      summary: "Listar Empleados"
      description: "Consulta una página de fichas laborales de la Empresa autorizada."
      operationId: "listarEmpleados"
      x-use-case: "PER-UC-001"
      x-business-rules: ["PER-BR-001","PER-BR-002","PER-BR-003","PER-BR-004","PER-BR-005","PER-BR-006"]
      parameters:
        -
          $ref: "#/components/parameters/Limite"
        -
          $ref: "#/components/parameters/Desplazamiento"
        -
          name: "estado"
          in: "query"
          schema:
            $ref: "#/components/schemas/EstadoEmpleado"
        -
          name: "orden"
          in: "query"
          description: "El identificador ascendente desempata el orden."
          schema:
            type: "string"
            enum: ["apellido:asc","apellido:desc","nombre:asc","nombre:desc"]
            default: "apellido:asc"
      responses:
        "200":
          description: "Página de Empleados."
          headers:
            Cache-Control:
              $ref: "#/components/headers/CachePrivada"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ListadoEmpleados"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    post:
      tags: ["Empleados"]
      summary: "Registrar Empleado"
      description: "Crea una ficha y su período laboral inicial."
      operationId: "registrarEmpleado"
      x-use-case: "PER-UC-001"
      x-business-rules: ["PER-BR-001","PER-BR-002","PER-BR-003","PER-BR-004","PER-BR-005","PER-BR-006"]
      x-precision-pendiente: "Cupo y fecha de ingreso según §4 y §7 del plan."
      parameters:
        -
          $ref: "#/components/parameters/ClaveIdempotencia"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SolicitudRegistrarEmpleado"
      responses:
        "201":
          description: "Ficha laboral registrada."
          headers:
            Cache-Control:
              $ref: "#/components/headers/CachePrivada"
            ETag:
              $ref: "#/components/headers/VersionFicha"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/FichaEmpleado"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "409":
          $ref: "#/components/responses/ConflictoDocumento"
        "422":
          description: "Ficha inválida o cupo de Empleados activos agotado."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problema"
                  -
                    properties:
                      code:
                        enum: ["PER_TENANT_INVALIDO","PER_EMPLEADO_INVALIDO","PER_DATO_PERSONAL_INVALIDO","PER_LIMITE_EMPLEADOS_ALCANZADO"]
        "500":
          $ref: "#/components/responses/ErrorInterno"
  "/empleados/{empleadoId}":
    parameters:
      -
        $ref: "#/components/parameters/EmpleadoId"
    get:
      tags: ["Empleados"]
      summary: "Consultar Empleado"
      description: "Devuelve la ficha administrativa y sus antecedentes dentro de la Empresa autorizada."
      operationId: "consultarEmpleado"
      x-use-case: "PER-UC-001"
      x-business-rules: ["PER-BR-001","PER-BR-002","PER-BR-003","PER-BR-004","PER-BR-005","PER-BR-006"]
      responses:
        "200":
          $ref: "#/components/responses/FichaActualizada"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "404":
          $ref: "#/components/responses/RecursoNoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    patch:
      tags: ["Empleados"]
      summary: "Modificar Empleado"
      description: "Actualiza los atributos descriptivos indicados."
      operationId: "modificarEmpleado"
      x-use-case: "PER-UC-001"
      x-business-rules: ["PER-BR-001","PER-BR-002","PER-BR-003","PER-BR-004","PER-BR-005","PER-BR-006"]
      parameters:
        -
          $ref: "#/components/parameters/ClaveIdempotencia"
        -
          $ref: "#/components/parameters/SiCoincideVersion"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SolicitudModificarEmpleado"
      responses:
        "200":
          $ref: "#/components/responses/FichaActualizada"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "404":
          $ref: "#/components/responses/RecursoNoEncontrado"
        "409":
          $ref: "#/components/responses/ConflictoDocumento"
        "422":
          $ref: "#/components/responses/DatosFichaInvalidos"
        "500":
          $ref: "#/components/responses/ErrorInterno"
  "/empleados/{empleadoId}/datos-laborales":
    parameters:
      -
        $ref: "#/components/parameters/EmpleadoId"
    patch:
      tags: ["Empleados"]
      summary: "Modificar datos auxiliares"
      description: "Registra altas y modificaciones de contactos, especialidades y licencias. Los registros omitidos se conservan."
      operationId: "modificarDatosLaboralesEmpleado"
      x-use-case: "PER-UC-001"
      x-business-rules: ["PER-BR-001","PER-BR-002","PER-BR-003","PER-BR-004","PER-BR-005","PER-BR-006"]
      x-precision-pendiente: "Datos opcionales y mantenimiento según §7 del plan."
      parameters:
        -
          $ref: "#/components/parameters/ClaveIdempotencia"
        -
          $ref: "#/components/parameters/SiCoincideVersion"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SolicitudModificarDatosLaborales"
      responses:
        "200":
          $ref: "#/components/responses/FichaActualizada"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "404":
          $ref: "#/components/responses/RecursoNoEncontrado"
        "409":
          $ref: "#/components/responses/ConflictoEscritura"
        "422":
          $ref: "#/components/responses/DatosFichaInvalidos"
        "500":
          $ref: "#/components/responses/ErrorInterno"
  "/empleados/{empleadoId}/inactivaciones":
    parameters:
      -
        $ref: "#/components/parameters/EmpleadoId"
    post:
      tags: ["Empleados"]
      summary: "Inactivar Empleado"
      description: "Finaliza el período laboral y coordina la suspensión de acceso cuando corresponde."
      operationId: "inactivarEmpleado"
      x-use-case: "PER-UC-001"
      x-business-rules: ["PER-BR-001","PER-BR-002","PER-BR-003","PER-BR-004","PER-BR-005","PER-BR-006","PER-BR-008"]
      x-precision-pendiente: "Revocación inmediata y rollback según ADR-0011 y §7 del plan."
      parameters:
        -
          $ref: "#/components/parameters/ClaveIdempotencia"
        -
          $ref: "#/components/parameters/SiCoincideVersion"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SolicitudCambioEstadoEmpleado"
      responses:
        "200":
          $ref: "#/components/responses/FichaActualizada"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "404":
          $ref: "#/components/responses/RecursoNoEncontrado"
        "409":
          $ref: "#/components/responses/ConflictoEscritura"
        "422":
          description: "Transición laboral inválida."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problema"
                  -
                    properties:
                      code:
                        enum: ["PER_TENANT_INVALIDO","PER_TRANSICION_EMPLEADO_INVALIDA"]
        "500":
          $ref: "#/components/responses/ErrorInactivacion"
  "/empleados/{empleadoId}/reactivaciones":
    parameters:
      -
        $ref: "#/components/parameters/EmpleadoId"
    post:
      tags: ["Empleados"]
      summary: "Reactivar Empleado"
      description: "Reabre el vínculo laboral en la ficha existente."
      operationId: "reactivarEmpleado"
      x-use-case: "PER-UC-001"
      x-business-rules: ["PER-BR-001","PER-BR-002","PER-BR-003","PER-BR-004","PER-BR-005","PER-BR-006","PER-BR-008"]
      parameters:
        -
          $ref: "#/components/parameters/ClaveIdempotencia"
