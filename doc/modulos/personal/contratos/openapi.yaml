    post:
      tags: ["Disponibilidad"]
      summary: "Registrar restricción"
      description: "Registra una restricción dentro de la ficha autorizada."
      operationId: "registrarRestriccion"
      x-use-case: "PER-UC-003"
      x-business-rules: ["PER-BR-001","PER-BR-004","PER-BR-021","PER-BR-022"]
      parameters:
        -
          $ref: "#/components/parameters/ClaveIdempotencia"
