          $ref: "#/components/responses/FichaActualizada"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          $ref: "#/components/responses/AccesoDenegado"
        "404":
          $ref: "#/components/responses/RecursoNoEncontrado"
        "409":
          $ref: "#/components/responses/ConflictoEscritura"
        "422":
          $ref: "#/components/responses/DisponibilidadInvalida"
        "500":
          $ref: "#/components/responses/ErrorInterno"
  "/empleados/{empleadoId}/restricciones/{restriccionId}/anulaciones":
    parameters:
      -
        $ref: "#/components/parameters/EmpleadoId"
      -
        $ref: "#/components/parameters/RestriccionId"
    post:
      tags: ["Disponibilidad"]
      summary: "Anular restricción"
      description: "Anula la restricción y conserva su antecedente."
      operationId: "anularRestriccion"
      x-use-case: "PER-UC-003"
      x-business-rules: ["PER-BR-001","PER-BR-004","PER-BR-021","PER-BR-022"]
      parameters:
        -
          $ref: "#/components/parameters/ClaveIdempotencia"
        -
