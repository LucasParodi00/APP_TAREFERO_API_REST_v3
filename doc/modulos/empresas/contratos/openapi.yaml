openapi: 3.1.0
info:
  title: Tarefero API REST — Empresas
  version: 0.1.0
  description: Contratos de PLAN-EMP-0001 y PLAN-EMP-0002. Las operaciones del segundo plan están propuestas.
  contact:
    name: Tarefero
servers:
  - url: /api/v1
tags:
  - name: Empresas
    description: Datos y configuración general de Empresas.
security:
  - Autenticacion: []
paths:
  /empresas:
    post:
      tags: [Empresas]
      summary: Registrar Empresa
      operationId: registrarEmpresa
      description: Registra una Empresa con su asignación comercial autorizada y configuración inicial.
      x-use-case: EMP-UC-001
      x-business-rules: [EMP-BR-001, EMP-BR-002, EMP-BR-003, EMP-BR-004, EMP-BR-006, EMP-BR-009, EMP-BR-010, EMP-BR-011, EMP-BR-012, EMP-BR-013]
      parameters:
        - name: Idempotency-Key
          in: header
          description: Clave de reintento del alta.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRegistrarEmpresa'
      responses:
        '201':
          description: Empresa registrada.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri-reference
            ETag:
              $ref: '#/components/headers/VersionEmpresa'
            ETag-Configuracion:
              $ref: '#/components/headers/VersionConfiguracion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEmpresa'
        '400':
          $ref: '#/components/responses/FormatoInvalido'
        '401':
          $ref: '#/components/responses/AutenticacionInvalida'
        '403':
          description: Acceso denegado.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [EMP_ACCESO_DENEGADO]
        '409':
          description: Conflicto al registrar la Empresa.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [EMP_ALIAS_NO_DISPONIBLE, EMP_IDEMPOTENCIA_CONFLICTO]
        '422':
          description: El alta incumple una regla del caso de uso.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [EMP_NOMBRE_OBLIGATORIO, EMP_NOMBRE_INVALIDO, EMP_UBICACION_GEOGRAFICA_INVALIDA, EMP_CUIT_INVALIDO, EMP_TEXTO_INVALIDO, EMP_ALIAS_INVALIDO, EMP_ASIGNACION_COMERCIAL_REQUERIDA, EMP_CONFIGURACION_GENERAL_INVALIDA]
        '500':
          $ref: '#/components/responses/ErrorInterno'
    get:
      tags: [Empresas]
      summary: Listar Empresas
      operationId: listarEmpresas
      description: Lista las Empresas visibles para el actor autorizado.
      x-use-case: EMP-UC-003
      x-business-rules: []
      parameters:
        - name: limite
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: desplazamiento
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoEmpresa'
        - name: orden
          in: query
          schema:
            type: string
            enum: ['nombre:asc', 'nombre:desc', 'estado:asc', 'estado:desc']
            default: 'nombre:asc'
          description: El identificador ascendente desempata el orden.
      responses:
        '200':
          description: Página de Empresas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaListadoEmpresas'
        '400':
          description: Consulta inválida.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [EMP_CONSULTA_INVALIDA]
        '401':
          $ref: '#/components/responses/AutenticacionInvalida'
        '403':
          description: Acceso denegado.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [EMP_ACCESO_DENEGADO]
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /empresas/{id}:
    parameters:
      - $ref: '#/components/parameters/IdentificadorEmpresa'
    get:
      tags: [Empresas]
      summary: Consultar Empresa
      operationId: consultarEmpresa
      description: Devuelve la Empresa dentro del alcance autorizado.
      x-use-case: EMP-UC-002
      x-business-rules: [EMP-BR-007]
      responses:
        '200':
          $ref: '#/components/responses/Empresa'
        '400':
          $ref: '#/components/responses/FormatoInvalido'
        '401':
          $ref: '#/components/responses/AutenticacionInvalida'
        '403':
          description: Acceso denegado.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [EMP_ACCESO_DENEGADO]
        '404':
          description: Empresa ausente en el alcance autorizado.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [EMP_EMPRESA_NO_ENCONTRADA]
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      tags: [Empresas]
      summary: Modificar Empresa
      operationId: modificarEmpresa
      description: Actualiza los datos de Empresa permitidos mediante control de versión.
      x-use-case: EMP-UC-004
      x-business-rules: [EMP-BR-001, EMP-BR-002, EMP-BR-003, EMP-BR-007, EMP-BR-010, EMP-BR-013, EMP-BR-014]
      parameters:
        - name: If-Match
          in: header
          required: true
          description: ETag de la representación de Empresa.
          schema:
            $ref: '#/components/schemas/EtiquetaEmpresa'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudModificarEmpresa'
      responses:
        '200':
          $ref: '#/components/responses/Empresa'
        '400':
          $ref: '#/components/responses/FormatoInvalido'
        '401':
          $ref: '#/components/responses/AutenticacionInvalida'
        '403':
          description: Acceso denegado.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [EMP_ACCESO_DENEGADO]
        '404':
          description: Empresa ausente en el alcance autorizado.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [EMP_EMPRESA_NO_ENCONTRADA]
        '409':
          $ref: '#/components/responses/VersionEnConflicto'
        '422':
          description: La modificación incumple una regla del caso de uso.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [EMP_MODIFICACION_NO_PERMITIDA, EMP_ALIAS_INMUTABLE, EMP_NOMBRE_OBLIGATORIO, EMP_NOMBRE_INVALIDO, EMP_UBICACION_GEOGRAFICA_INVALIDA, EMP_CUIT_INVALIDO, EMP_TEXTO_INVALIDO]
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /empresas/{id}/configuracion-general:
    parameters:
      - $ref: '#/components/parameters/IdentificadorEmpresa'
    patch:
      tags: [Empresas]
      summary: Modificar configuración general de Empresa
      operationId: modificarConfiguracionGeneralEmpresa
      description: Actualiza la configuración general de la Empresa dentro del alcance autorizado.
      x-use-case: EMP-UC-008
      x-business-rules: [EMP-BR-006, EMP-BR-007, EMP-BR-014]
      parameters:
        - name: If-Match
          in: header
          required: true
          description: ETag de configuración general obtenido en ETag-Configuracion al consultar Empresa o en ETag al actualizar la configuración.
          schema:
            $ref: '#/components/schemas/EtiquetaConfiguracion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudModificarConfiguracionGeneral'
      responses:
        '200':
          description: Configuración general actualizada.
          headers:
            ETag:
              $ref: '#/components/headers/VersionConfiguracion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaConfiguracionGeneral'
        '400':
          $ref: '#/components/responses/FormatoInvalido'
        '401':
          $ref: '#/components/responses/AutenticacionInvalida'
        '403':
          description: Acceso denegado.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [EMP_ACCESO_DENEGADO]
        '404':
          description: Empresa ausente en el alcance autorizado.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [EMP_EMPRESA_NO_ENCONTRADA]
        '409':
          $ref: '#/components/responses/VersionEnConflicto'
        '422':
          description: La modificación incumple una regla del caso de uso.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      code:
                        enum: [EMP_MODIFICACION_NO_PERMITIDA, EMP_CONFIGURACION_GENERAL_INVALIDA]
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /empresas/{id}/suspensiones:
    parameters:
      - $ref: "#/components/parameters/IdentificadorEmpresa"
    post:
      tags: [Empresas]
      summary: "Suspender Empresa"
      description: "Suspende una Empresa activa conservando los datos e historial."
      operationId: suspenderEmpresa
      x-use-case: EMP-UC-005
      x-business-rules: [EMP-BR-004, EMP-BR-005, EMP-BR-008]
      parameters:
        - name: If-Match
          in: header
          description: "ETag de la representación de Empresa."
          required: true
          schema:
            $ref: "#/components/schemas/EtiquetaEmpresa"
        - name: Idempotency-Key
          in: header
          description: "Clave de reintento vinculada al actor, la Empresa y la operación."
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          $ref: "#/components/responses/Empresa"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          description: "El actor carece del permiso de plataforma."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [EMP_ACCESO_DENEGADO]
        "404":
          description: "Empresa ausente dentro del alcance autorizado."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [EMP_EMPRESA_NO_ENCONTRADA]
        "409":
          description: "Versión desactualizada o clave de idempotencia reutilizada con otra carga."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [EMP_VERSION_CONFLICTO, EMP_IDEMPOTENCIA_CONFLICTO]
        "422":
          description: "El estado actual no admite la transición solicitada."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [EMP_TRANSICION_ESTADO_INVALIDA]
        "500":
          $ref: "#/components/responses/ErrorInterno"
  /empresas/{id}/reactivaciones:
    parameters:
      - $ref: "#/components/parameters/IdentificadorEmpresa"
    post:
      tags: [Empresas]
      summary: "Reactivar Empresa"
      description: "Reactiva una Empresa suspendida."
      operationId: reactivarEmpresa
      x-use-case: EMP-UC-006
      x-business-rules: [EMP-BR-004, EMP-BR-005]
      parameters:
        - name: If-Match
          in: header
          description: "ETag de la representación de Empresa."
          required: true
          schema:
            $ref: "#/components/schemas/EtiquetaEmpresa"
        - name: Idempotency-Key
          in: header
          description: "Clave de reintento vinculada al actor, la Empresa y la operación."
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          $ref: "#/components/responses/Empresa"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          description: "El actor carece del permiso de plataforma."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [EMP_ACCESO_DENEGADO]
        "404":
          description: "Empresa ausente dentro del alcance autorizado."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [EMP_EMPRESA_NO_ENCONTRADA]
        "409":
          description: "Versión desactualizada o clave de idempotencia reutilizada con otra carga."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [EMP_VERSION_CONFLICTO, EMP_IDEMPOTENCIA_CONFLICTO]
        "422":
          description: "El estado actual no admite la transición solicitada."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [EMP_TRANSICION_ESTADO_INVALIDA]
        "500":
          $ref: "#/components/responses/ErrorInterno"
  /empresas/{id}/cierres:
    parameters:
      - $ref: "#/components/parameters/IdentificadorEmpresa"
    post:
      tags: [Empresas]
      summary: "Cerrar Empresa"
      description: "Cierra una Empresa de forma irreversible y conserva sus relaciones e historial."
      operationId: cerrarEmpresa
      x-use-case: EMP-UC-007
      x-business-rules: [EMP-BR-004, EMP-BR-005, EMP-BR-008]
      parameters:
        - name: If-Match
          in: header
          description: "ETag de la representación de Empresa."
          required: true
          schema:
            $ref: "#/components/schemas/EtiquetaEmpresa"
        - name: Idempotency-Key
          in: header
          description: "Clave de reintento vinculada al actor, la Empresa y la operación."
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          $ref: "#/components/responses/Empresa"
        "400":
          $ref: "#/components/responses/FormatoInvalido"
        "401":
          $ref: "#/components/responses/AutenticacionInvalida"
        "403":
          description: "El actor carece del permiso de plataforma."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [EMP_ACCESO_DENEGADO]
        "404":
          description: "Empresa ausente dentro del alcance autorizado."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [EMP_EMPRESA_NO_ENCONTRADA]
        "409":
          description: "Versión desactualizada o clave de idempotencia reutilizada con otra carga."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [EMP_VERSION_CONFLICTO, EMP_IDEMPOTENCIA_CONFLICTO]
        "422":
          description: "El estado actual no admite la transición solicitada."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problema"
                  - properties:
                      code:
                        enum: [EMP_TRANSICION_ESTADO_INVALIDA]
        "500":
          $ref: "#/components/responses/ErrorInterno"
components:
  securitySchemes:
    Autenticacion:
      type: http
      scheme: bearer
      description: Credencial verificada por Identidad y Acceso.
  parameters:
    IdentificadorEmpresa:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identificador'
  headers:
    VersionEmpresa:
      required: true
      description: Versión de la representación de Empresa y su configuración general.
      schema:
        $ref: '#/components/schemas/EtiquetaEmpresa'
    VersionConfiguracion:
      required: true
      description: Versión de la representación de configuración general.
      schema:
        $ref: '#/components/schemas/EtiquetaConfiguracion'
  responses:
    Empresa:
      description: Datos y configuración general de la Empresa.
      headers:
        ETag:
          $ref: '#/components/headers/VersionEmpresa'
        ETag-Configuracion:
          $ref: '#/components/headers/VersionConfiguracion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaEmpresa'
    FormatoInvalido:
      description: Solicitud con formato inválido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    AutenticacionInvalida:
      description: Autenticación ausente o inválida.
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    VersionEnConflicto:
      description: Conflicto de versión.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - properties:
                  code:
                    const: EMP_VERSION_CONFLICTO
    ErrorInterno:
      description: Error interno con información segura.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
  schemas:
    Identificador:
      type: string
      format: uuid
    Version:
      type: integer
      minimum: 1
    EtiquetaEmpresa:
      type: string
      pattern: '^"emp-[1-9][0-9]*-cfg-[1-9][0-9]*"$'
    EtiquetaConfiguracion:
      type: string
      pattern: '^"cfg-[1-9][0-9]*"$'
    EstadoEmpresa:
      type: string
      enum: [ACTIVA, SUSPENDIDA, CERRADA]
    PuntoGeografico:
      type: object
      additionalProperties: false
      required: [latitud, longitud]
      properties:
        latitud:
          $ref: '#/components/schemas/Coordenada'
        longitud:
          $ref: '#/components/schemas/Coordenada'
    Coordenada:
      type: string
      description: Coordenada en grados decimales.
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    SolicitudRegistrarEmpresa:
      type: object
      additionalProperties: false
      required: [nombre, alias]
      properties:
        nombre:
          type: string
        alias:
          type: string
        cuit:
          type: string
        responsableNombre:
          type: string
        ubicacionTexto:
          type: string
        ubicacionGeografica:
          $ref: '#/components/schemas/PuntoGeografico'
        descripcionActividad:
          type: string
    SolicitudModificarEmpresa:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombre:
          type: string
        alias:
          type: string
          description: Alias conocido de la Empresa.
        cuit:
          type: [string, 'null']
        responsableNombre:
          type: [string, 'null']
        ubicacionTexto:
          type: [string, 'null']
        ubicacionGeografica:
          oneOf:
            - $ref: '#/components/schemas/PuntoGeografico'
            - type: 'null'
        descripcionActividad:
          type: [string, 'null']
    SolicitudModificarConfiguracionGeneral:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        paisReferencia:
          type: string
        zonaHoraria:
          type: string
        monedaPrincipal:
          type: string
    RespuestaEmpresa:
      type: object
      additionalProperties: false
      required: [id, nombre, alias, estado, version, configuracionGeneral]
      properties:
        id:
          $ref: '#/components/schemas/Identificador'
        nombre:
          type: string
        alias:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoEmpresa'
        version:
          $ref: '#/components/schemas/Version'
        cuit:
          type: string
        responsableNombre:
          type: string
        ubicacionTexto:
          type: string
        ubicacionGeografica:
          $ref: '#/components/schemas/PuntoGeografico'
        descripcionActividad:
          type: string
        configuracionGeneral:
          $ref: '#/components/schemas/RespuestaConfiguracionGeneral'
    RespuestaConfiguracionGeneral:
      type: object
      additionalProperties: false
      required: [paisReferencia, zonaHoraria, monedaPrincipal, version]
      properties:
        paisReferencia:
          type: string
          pattern: '^[A-Z]{2}$'
        zonaHoraria:
          type: string
          maxLength: 255
        monedaPrincipal:
          type: string
          pattern: '^[A-Z]{3}$'
        version:
          $ref: '#/components/schemas/Version'
    RespuestaListadoEmpresas:
      type: object
      additionalProperties: false
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/ResumenEmpresa'
        paginacion:
          type: object
          additionalProperties: false
          required: [limite, desplazamiento, total]
          properties:
            limite:
              type: integer
              minimum: 1
              maximum: 100
            desplazamiento:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
    ResumenEmpresa:
      type: object
      additionalProperties: false
      required: [id, nombre, alias, estado]
      properties:
        id:
          $ref: '#/components/schemas/Identificador'
        nombre:
          type: string
        alias:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoEmpresa'
    Problema:
      type: object
      required: [type, title, status, code, detail, instance, solicitudId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        solicitudId:
          $ref: '#/components/schemas/Identificador'
        errores:
          type: array
          items:
            type: object
            required: [campo, code, mensaje]
            properties:
              campo:
                type: string
              code:
                type: string
              mensaje:
                type: string
