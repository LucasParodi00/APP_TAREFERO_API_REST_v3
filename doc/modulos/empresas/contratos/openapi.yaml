openapi: 3.1.0
info:
  title: API Módulo Empresas - Tarefero
  description: Contrato HTTP para la administración de Empresas clientes y su configuración general.
  version: 1.0.0
  contact:
    name: Tarefero Core Team
    url: https://tarefero.com
servers:
  - url: /api/v1
    description: Servidor principal API v1
tags:
  - name: Empresas
    description: Operaciones sobre Empresas cliente y su configuración
paths:
  /empresas:
    post:
      tags:
        - Empresas
      summary: Registrar una nueva Empresa
      description: Incorpora una nueva Empresa cliente a la plataforma.
      operationId: registrarEmpresa
      x-use-case: EMP-UC-001
      x-business-rules:
        - EMP-BR-001
        - EMP-BR-002
        - EMP-BR-003
        - EMP-BR-004
        - EMP-BR-006
        - EMP-BR-009
        - EMP-BR-010
        - EMP-BR-011
        - EMP-BR-012
        - EMP-BR-013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRegistrarEmpresa'
      responses:
        '201':
          description: Empresa registrada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEmpresa'
          headers:
            ETag:
              schema:
                type: string
              description: Versión actual de la Empresa para control de concurrencia optimista
        '400':
          $ref: '#/components/responses/ErrorSolicitudInvalida'
        '403':
          $ref: '#/components/responses/ErrorAccesoDenegado'
        '409':
          $ref: '#/components/responses/ErrorConflicto'
        '422':
          $ref: '#/components/responses/ErrorReglaNegocio'
    get:
      tags:
        - Empresas
      summary: Listar Empresas registradas
      description: Recupera una colección paginada y filtrable de Empresas. Solo accesible para el SuperAdministrador.
      operationId: listarEmpresas
      x-use-case: EMP-UC-003
      parameters:
        - name: limite
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Cantidad máxima de registros a retornar
        - name: desplazamiento
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Cantidad de registros a omitir para paginación
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoEmpresa'
          description: Filtrar por estado de la Empresa
        - name: orden
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-zA-Z]+:(asc|desc)$'
            default: 'nombre:asc'
          description: Campo y dirección de ordenamiento (ej. nombre:asc)
      responses:
        '200':
          description: Página de Empresas obtenida con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaListadoEmpresas'
        '400':
          $ref: '#/components/responses/ErrorSolicitudInvalida'
        '403':
          $ref: '#/components/responses/ErrorAccesoDenegado'

  /empresas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Identificador único de la Empresa
    get:
      tags:
        - Empresas
      summary: Consultar una Empresa
      description: Obtiene los datos detallados, configuración general y estado de una Empresa autorizada.
      operationId: consultarEmpresa
      x-use-case: EMP-UC-002
      x-business-rules:
        - EMP-BR-007
      responses:
        '200':
          description: Datos de la Empresa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEmpresa'
          headers:
            ETag:
              schema:
                type: string
              description: Versión actual de la Empresa para concurrencia optimista
        '403':
          $ref: '#/components/responses/ErrorAccesoDenegado'
        '404':
          $ref: '#/components/responses/ErrorEmpresaNoEncontrada'
    put:
      tags:
        - Empresas
      summary: Modificar datos descriptivos de una Empresa
      description: Actualiza los datos descriptivos y de contacto de una Empresa. Requiere cabecera If-Match con la versión conocida.
      operationId: modificarEmpresa
      x-use-case: EMP-UC-004
      x-business-rules:
        - EMP-BR-001
        - EMP-BR-002
        - EMP-BR-003
        - EMP-BR-007
        - EMP-BR-010
        - EMP-BR-013
        - EMP-BR-014
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: ETag o número de versión que el cliente conoce de la Empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudModificarEmpresa'
      responses:
        '200':
          description: Empresa modificada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEmpresa'
          headers:
            ETag:
              schema:
                type: string
              description: Nueva versión de la Empresa
        '400':
          $ref: '#/components/responses/ErrorSolicitudInvalida'
        '403':
          $ref: '#/components/responses/ErrorAccesoDenegado'
        '404':
          $ref: '#/components/responses/ErrorEmpresaNoEncontrada'
        '409':
          $ref: '#/components/responses/ErrorConflicto'
        '422':
          $ref: '#/components/responses/ErrorReglaNegocio'

  /empresas/{id}/suspender:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Identificador de la Empresa a suspender
    post:
      tags:
        - Empresas
      summary: Suspender una Empresa
      description: Suspende temporalmente la Empresa impidiendo operaciones de negocio de sus cuentas. Requiere If-Match.
      operationId: suspenderEmpresa
      x-use-case: EMP-UC-005
      x-business-rules:
        - EMP-BR-004
        - EMP-BR-005
        - EMP-BR-008
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: ETag o versión vigente de la Empresa
      responses:
        '200':
          description: Empresa suspendida con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEmpresa'
          headers:
            ETag:
              schema:
                type: string
              description: Nueva versión de la Empresa
        '403':
          $ref: '#/components/responses/ErrorAccesoDenegado'
        '404':
          $ref: '#/components/responses/ErrorEmpresaNoEncontrada'
        '409':
          $ref: '#/components/responses/ErrorConflicto'
        '422':
          $ref: '#/components/responses/ErrorReglaNegocio'

  /empresas/{id}/reactivar:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Identificador de la Empresa a reactivar
    post:
      tags:
        - Empresas
      summary: Reactivar una Empresa
      description: Reactiva una Empresa previamente suspendida. Requiere If-Match.
      operationId: reactivarEmpresa
      x-use-case: EMP-UC-006
      x-business-rules:
        - EMP-BR-004
        - EMP-BR-005
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: ETag o versión vigente de la Empresa
      responses:
        '200':
          description: Empresa reactivada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEmpresa'
          headers:
            ETag:
              schema:
                type: string
              description: Nueva versión de la Empresa
        '403':
          $ref: '#/components/responses/ErrorAccesoDenegado'
        '404':
          $ref: '#/components/responses/ErrorEmpresaNoEncontrada'
        '409':
          $ref: '#/components/responses/ErrorConflicto'
        '422':
          $ref: '#/components/responses/ErrorReglaNegocio'

  /empresas/{id}/cerrar:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Identificador de la Empresa a cerrar
    post:
      tags:
        - Empresas
      summary: Cerrar definitivamente una Empresa
      description: Cierra irreversiblemente una Empresa conservando su identidad e historial. Requiere If-Match.
      operationId: cerrarEmpresa
      x-use-case: EMP-UC-007
      x-business-rules:
        - EMP-BR-004
        - EMP-BR-005
        - EMP-BR-008
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: ETag o versión vigente de la Empresa
      responses:
        '200':
          description: Empresa cerrada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEmpresa'
          headers:
            ETag:
              schema:
                type: string
              description: Nueva versión de la Empresa
        '403':
          $ref: '#/components/responses/ErrorAccesoDenegado'
        '404':
          $ref: '#/components/responses/ErrorEmpresaNoEncontrada'
        '409':
          $ref: '#/components/responses/ErrorConflicto'
        '422':
          $ref: '#/components/responses/ErrorReglaNegocio'

  /empresas/{id}/configuracion:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Identificador de la Empresa
    put:
      tags:
        - Empresas
      summary: Modificar configuración general de una Empresa
      description: Actualiza país de referencia, zona horaria y moneda principal. Requiere If-Match.
      operationId: modificarConfiguracionGeneral
      x-use-case: EMP-UC-008
      x-business-rules:
        - EMP-BR-006
        - EMP-BR-007
        - EMP-BR-014
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: ETag o versión vigente de la configuración general
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudModificarConfiguracionGeneral'
      responses:
        '200':
          description: Configuración general actualizada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaConfiguracionGeneral'
          headers:
            ETag:
              schema:
                type: string
              description: Nueva versión de la configuración general
        '400':
          $ref: '#/components/responses/ErrorSolicitudInvalida'
        '403':
          $ref: '#/components/responses/ErrorAccesoDenegado'
        '404':
          $ref: '#/components/responses/ErrorEmpresaNoEncontrada'
        '409':
          $ref: '#/components/responses/ErrorConflicto'
        '422':
          $ref: '#/components/responses/ErrorReglaNegocio'

components:
  schemas:
    EstadoEmpresa:
      type: string
      enum:
        - ACTIVA
        - SUSPENDIDA
        - CERRADA
      description: Estado del ciclo de vida de la Empresa

    PuntoGeografico:
      type: object
      required:
        - latitud
        - longitud
      properties:
        latitud:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitud en grados decimales (-90 a 90)
        longitud:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitud en grados decimales (-180 a 180)

    ConfiguracionGeneralEmpresa:
      type: object
      required:
        - id
        - empresaId
        - paisReferencia
        - zonaHoraria
        - monedaPrincipal
        - creadoEn
        - creadoPor
        - actualizadoEn
        - actualizadoPor
        - version
      properties:
        id:
          type: string
          format: uuid
        empresaId:
          type: string
          format: uuid
        paisReferencia:
          type: string
          pattern: '^[A-Z]{2}$'
          example: 'AR'
        zonaHoraria:
          type: string
          maxLength: 255
          example: 'America/Argentina/Buenos_Aires'
        monedaPrincipal:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'ARS'
        creadoEn:
          type: string
          format: date-time
        creadoPor:
          type: string
        actualizadoEn:
          type: string
          format: date-time
        actualizadoPor:
          type: string
        version:
          type: integer
          minimum: 1

    SolicitudRegistrarEmpresa:
      type: object
      required:
        - nombre
        - alias
      properties:
        nombre:
          type: string
          maxLength: 120
          description: Nombre de la Empresa (se eliminan espacios exteriores)
        alias:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          description: Identificador textual único, inmutable y no reutilizable
        cuit:
          type: string
          pattern: '^[0-9]{11}$'
          description: Clave de 11 dígitos numéricos sin separadores
        responsableNombre:
          type: string
          maxLength: 120
          description: Nombre del responsable o dueño
        ubicacionTexto:
          type: string
          maxLength: 500
          description: Domicilio o referencia administrativa
        ubicacionGeografica:
          $ref: '#/components/schemas/PuntoGeografico'
        descripcionActividad:
          type: string
          maxLength: 2000
          description: Descripción de la actividad comercial o agropecuaria
        paisReferencia:
          type: string
          pattern: '^[A-Z]{2}$'
          default: 'AR'
        zonaHoraria:
          type: string
          maxLength: 255
          default: 'America/Argentina/Buenos_Aires'
        monedaPrincipal:
          type: string
          pattern: '^[A-Z]{3}$'
          default: 'ARS'

    SolicitudModificarEmpresa:
      type: object
      required:
        - nombre
      properties:
        nombre:
          type: string
          maxLength: 120
          description: Nombre de la Empresa
        cuit:
          type: string
          pattern: '^[0-9]{11}$'
          nullable: true
        responsableNombre:
          type: string
          maxLength: 120
          nullable: true
        ubicacionTexto:
          type: string
          maxLength: 500
          nullable: true
        ubicacionGeografica:
          $ref: '#/components/schemas/PuntoGeografico'
        descripcionActividad:
          type: string
          maxLength: 2000
          nullable: true

    SolicitudModificarConfiguracionGeneral:
      type: object
      required:
        - paisReferencia
        - zonaHoraria
        - monedaPrincipal
      properties:
        paisReferencia:
          type: string
          pattern: '^[A-Z]{2}$'
        zonaHoraria:
          type: string
          maxLength: 255
        monedaPrincipal:
          type: string
          pattern: '^[A-Z]{3}$'

    RespuestaEmpresa:
      type: object
      required:
        - id
        - nombre
        - alias
        - estado
        - configuracionGeneral
        - creadoEn
        - creadoPor
        - actualizadoEn
        - actualizadoPor
        - version
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        alias:
          type: string
        cuit:
          type: string
          nullable: true
        responsableNombre:
          type: string
          nullable: true
        ubicacionTexto:
          type: string
          nullable: true
        ubicacionGeografica:
          $ref: '#/components/schemas/PuntoGeografico'
        descripcionActividad:
          type: string
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoEmpresa'
        configuracionGeneral:
          $ref: '#/components/schemas/ConfiguracionGeneralEmpresa'
        creadoEn:
          type: string
          format: date-time
        creadoPor:
          type: string
        actualizadoEn:
          type: string
          format: date-time
        actualizadoPor:
          type: string
        version:
          type: integer
          minimum: 1

    RespuestaConfiguracionGeneral:
      $ref: '#/components/schemas/ConfiguracionGeneralEmpresa'

    MetadatosPaginacion:
      type: object
      required:
        - limite
        - desplazamiento
        - total
      properties:
        limite:
          type: integer
        desplazamiento:
          type: integer
        total:
          type: integer

    RespuestaListadoEmpresas:
      type: object
      required:
        - datos
        - paginacion
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/RespuestaEmpresa'
        paginacion:
          $ref: '#/components/schemas/MetadatosPaginacion'

    DetalleErrorValidacion:
      type: object
      required:
        - campo
        - code
        - mensaje
      properties:
        campo:
          type: string
        code:
          type: string
        mensaje:
          type: string

    ProblemaDetalle:
      type: object
      required:
        - type
        - title
        - status
        - code
        - detail
        - instance
        - solicitudId
      properties:
        type:
          type: string
          example: 'about:blank'
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
        solicitudId:
          type: string
          format: uuid
        errores:
          type: array
          items:
            $ref: '#/components/schemas/DetalleErrorValidacion'

  responses:
    ErrorSolicitudInvalida:
      description: Solicitud con formato o datos inválidos (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaDetalle'

    ErrorAccesoDenegado:
      description: Actor autenticado sin permisos o acceso denegado a otra Empresa (EMP_ACCESO_DENEGADO)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaDetalle'

    ErrorEmpresaNoEncontrada:
      description: La Empresa solicitada no existe dentro del alcance autorizado (EMP_EMPRESA_NO_ENCONTRADA)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaDetalle'

    ErrorConflicto:
      description: Conflicto de versión optimista (EMP_VERSION_CONFLICTO) o alias no disponible (EMP_ALIAS_NO_DISPONIBLE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaDetalle'

    ErrorReglaNegocio:
      description: Incumplimiento de regla de negocio o transición no permitida (422)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaDetalle'
